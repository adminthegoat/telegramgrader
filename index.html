<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TG Grader — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b12;
      --bg-elev: #0f1420;
      --card: #141b2b;
      --card-2: #192236;
      --border: rgba(255, 255, 255, 0.08);
      --border-hi: rgba(56, 189, 248, 0.38);
      --text: #f8fafc;
      --muted: #8b9bb4;
      --accent: #2aabee;
      --accent-2: #8b5cf6;
      --green: #10b981;
      --red: #f43f5e;
      --gold: #f59e0b;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #04060a;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    .font-display {
      font-family: 'Unbounded', sans-serif;
    }

    /* Animations */
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(14px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.86); }
      70% { transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(42, 171, 238, 0.35); }
      50% { box-shadow: 0 0 16px 3px rgba(42, 171, 238, 0.22); }
    }
    @keyframes shimmerSweep {
      0% { transform: translateX(-120%) skewX(-18deg); }
      100% { transform: translateX(220%) skewX(-18deg); }
    }
    @keyframes carPulse {
      0%, 100% { opacity: 0.92; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.04); }
    }

    .anim-page {
      animation: fadeSlideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Mobile App Shell */
    .tma-shell {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: radial-gradient(circle at 50% -10%, rgba(42, 171, 238, 0.16), transparent 55%),
                  radial-gradient(circle at 90% 20%, rgba(139, 92, 246, 0.12), transparent 50%),
                  var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.85);
    }

    /* Header */
    .tma-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(15, 20, 32, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 30;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #7dd3fc 55%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .brand-title:active {
      transform: scale(0.95);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .cur-pill {
      position: relative;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cur-pill:active {
      transform: scale(0.96);
    }
    .cur-pill .cur-sym {
      color: #38bdf8;
      font-weight: 900;
    }

    .cur-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 155px;
      background: #131b2e;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.65);
      display: none;
      z-index: 80;
      animation: popIn 0.2s ease both;
    }
    .cur-dropdown.open {
      display: block;
    }
    .cur-opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }
    .cur-opt:hover, .cur-opt.active {
      background: rgba(42, 171, 238, 0.18);
      color: #38bdf8;
    }

    .dep-btn {
      position: relative;
      overflow: hidden;
      padding: 7px 12px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #2aabee 0%, #6366f1 55%, #8b5cf6 100%);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(42, 171, 238, 0.35);
      white-space: nowrap;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .dep-btn::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 45%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
      animation: shimmerSweep 3.2s infinite;
    }
    .dep-btn:active {
      transform: scale(0.94);
    }

    .avatar-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #8b5cf6);
      padding: 1.5px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .avatar-btn:active {
      transform: scale(0.92);
    }
    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      overflow: hidden;
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Main Content Scroll */
    .tma-main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 12px calc(84px + var(--safe-bottom));
      scroll-behavior: smooth;
    }
    .tma-main::-webkit-scrollbar {
      width: 0px;
    }

    /* Section Header */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .sec-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .back-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .back-pill:active {
      transform: scale(0.94);
      color: #fff;
    }

    /* Games Grid (No Descriptions) */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .game-card {
      position: relative;
      border-radius: 18px;
      padding: 16px 14px;
      background: linear-gradient(155deg, rgba(25, 34, 54, 0.96), rgba(15, 20, 32, 0.98));
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      min-height: 104px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.22s ease;
      animation: fadeSlideUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .game-card:hover {
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .game-card:active {
      transform: scale(0.95);
    }
    .game-card .g-glow {
      position: absolute;
      right: -18px;
      bottom: -18px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      filter: blur(22px);
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .game-card:hover .g-glow {
      opacity: 0.65;
      transform: scale(1.15);
    }
    .game-card .g-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      animation: floatSlow 3.4s ease-in-out infinite;
    }
    .game-card .g-name {
      font-family: 'Unbounded', sans-serif;
      font-size: 12.5px;
      font-weight: 800;
      color: #fff;
      margin-top: 12px;
      letter-spacing: -0.01em;
    }
    .game-card .g-tag {
      position: absolute;
      top: 11px;
      right: 11px;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Bottom Navigation (3 Tabs) */
    .tma-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(13, 18, 29, 0.94);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px 8px calc(6px + var(--safe-bottom));
      z-index: 40;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav-item svg {
      width: 20px;
      height: 20px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav-item.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.09);
    }
    .nav-item.active svg {
      transform: translateY(-2px) scale(1.06);
    }

    /* Common Panels & Buttons */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 10px;
      animation: fadeSlideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .btn-main {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #2aabee, #6366f1);
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(42, 171, 238, 0.28);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.16s;
    }
    .btn-main:active {
      transform: scale(0.96);
    }
    .btn-main:disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    .btn-green {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.28);
    }

    /* Gift Grid */
    .gift-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .gift-item {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .gift-item:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .gift-item.selected {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.13);
      box-shadow: 0 0 0 1px #38bdf8 inset;
    }
    .gift-thumb {
      width: 48px;
      height: 48px;
      margin: 0 auto 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }
    .gift-item:hover .gift-thumb {
      transform: scale(1.08);
    }
    .gift-thumb img, .gift-thumb svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45));
    }
    .gift-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gift-val {
      font-size: 10px;
      font-weight: 800;
      color: #38bdf8;
      margin-top: 2px;
    }

    /* Upgrader / Arenagrade Slots */
    .upg-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .upg-slot {
      background: var(--bg-elev);
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 11px;
      text-align: center;
      min-height: 112px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .upg-slot:active {
      transform: scale(0.96);
    }
    .upg-slot.filled {
      border-style: solid;
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.06);
    }

    /* Input Controls */
    .bet-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 8px;
      margin-bottom: 10px;
    }
    .bet-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      width: 100%;
    }
    .bet-chip {
      padding: 5px 8px;
      border-radius: 8px;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .bet-chip:active {
      transform: scale(0.92);
      color: #fff;
    }

    /* Mines 5x5 */
    .mines-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 10px 0;
    }
    .mine-tile {
      aspect-ratio: 1;
      border-radius: 12px;
      background: linear-gradient(145deg, #1d283f, #131b2c);
      border: 1px solid rgba(255,255,255,0.09);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s, border-color 0.2s;
    }
    .mine-tile:active {
      transform: scale(0.9);
    }
    .mine-tile.safe {
      background: rgba(16, 185, 129, 0.22);
      border-color: #10b981;
      color: #34d399;
      animation: popIn 0.24s ease both;
    }
    .mine-tile.bomb {
      background: rgba(244, 63, 94, 0.25);
      border-color: #f43f5e;
      color: #fb7185;
      animation: popIn 0.24s ease both;
    }

    /* Horizontal Cars (Машинки без эмодзи, с буквами TG) */
    .cars-board {
      background: #0b101b;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 8px;
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .cars-mult-header {
      display: grid;
      grid-template-columns: 44px repeat(5, 1fr);
      gap: 0;
      margin-bottom: 4px;
      text-align: center;
    }
    .cars-mult-cell {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      padding: 2px 0;
    }
    .cars-mult-cell.active {
      color: #38bdf8;
    }
    .cars-mult-cell.passed {
      color: #10b981;
    }
    .cars-row {
      display: grid;
      grid-template-columns: 44px repeat(5, 1fr);
      align-items: center;
      height: 38px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .cars-row:last-child {
      border-bottom: none;
    }
    .cars-start-x {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: 'Unbounded', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      transition: color 0.15s, transform 0.15s;
    }
    .cars-start-x.selected-row {
      color: #38bdf8;
    }
    .cars-lane-cell {
      position: relative;
      height: 100%;
      border-left: 1.5px solid rgba(148, 163, 184, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    .cars-lane-cell:last-child {
      border-right: 1.5px solid rgba(148, 163, 184, 0.28);
    }
    .cars-lane-cell.col-passed {
      background: rgba(16, 185, 129, 0.06);
    }
    .cars-lane-cell.col-current {
      background: rgba(56, 189, 248, 0.08);
    }
    .cars-lane-cell.col-crash {
      background: rgba(244, 63, 94, 0.24);
    }
    .tg-hero-badge {
      padding: 4px 7px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2aabee, #8b5cf6);
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.02em;
      box-shadow: 0 0 12px rgba(42, 171, 238, 0.55);
      animation: popIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
      z-index: 3;
    }
    .tg-hero-badge.crashed {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.7);
    }
    .car-block {
      width: 24px;
      height: 14px;
      border-radius: 4px;
      background: linear-gradient(90deg, #334155, #475569);
      border: 1px solid rgba(255,255,255,0.18);
      position: relative;
      animation: carPulse 1.6s ease-in-out infinite;
    }
    .car-block.danger {
      background: linear-gradient(90deg, #ef4444, #b91c1c);
      border-color: #fca5a5;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.55);
    }

    /* Tower (5-4-3-4-5-4-3-4-5 X-Slots) */
    .tower-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 8px 0 12px;
    }
    .tower-floor {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 12px;
      background: rgba(15, 20, 32, 0.65);
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.2s ease;
    }
    .tower-floor.active-floor {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.09);
      animation: pulseGlow 2s infinite;
    }
    .tower-floor.passed-floor {
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.05);
    }
    .tower-mult {
      width: 38px;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
    }
    .tower-floor.active-floor .tower-mult {
      color: #38bdf8;
    }
    .tower-slots-row {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 6px;
    }
    .tower-x-slot {
      width: 40px;
      height: 29px;
      border-radius: 8px;
      background: var(--card-2);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Unbounded', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tower-floor.active-floor .tower-x-slot {
      color: #e2e8f0;
      border-color: rgba(56, 189, 248, 0.35);
    }
    .tower-x-slot:active {
      transform: scale(0.9);
    }
    .tower-x-slot.safe {
      background: rgba(16, 185, 129, 0.24);
      border-color: #10b981;
      color: #34d399;
      animation: popIn 0.22s ease both;
    }
    .tower-x-slot.trap {
      background: rgba(244, 63, 94, 0.26);
      border-color: #f43f5e;
      color: #fb7185;
      animation: popIn 0.22s ease both;
    }

    /* Case Roulette */
    .roulette-window {
      position: relative;
      width: 100%;
      height: 102px;
      background: #0a0e17;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin: 10px 0;
    }
    .roulette-pointer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: #38bdf8;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 10px #38bdf8;
    }
    .roulette-track {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 8px;
      padding: 0 12px;
      will-change: transform;
    }
    .r-card {
      width: 82px;
      height: 82px;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 12, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 86dvh;
      background: #111827;
      border-top: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px 22px 0 0;
      padding: 16px 14px calc(18px + var(--safe-bottom));
      overflow-y: auto;
      animation: sheetUp 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Toast */
    .toast-box {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 90%;
      max-width: 400px;
      pointer-events: none;
    }
    .toast {
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: popIn 0.22s ease both;
    }
  </style>
</head>
<body>
  <div class="tma-shell">
    <!-- HEADER -->
    <header class="tma-header">
      <div class="brand-title" onclick="go('/games')">TG Grader</div>

      <div class="header-actions">
        <div class="cur-pill" onclick="toggleCurMenu(event)">
          <span class="cur-sym" id="hdrCurSym">₽</span>
          <span id="hdrBalVal">0</span>
          <span style="font-size:9px;color:var(--muted);">▾</span>

          <div class="cur-dropdown" id="curDropdown">
            <div class="cur-opt" onclick="setCurrency('RUB', event)">
              <span>₽ Рубли</span><span>RUB</span>
            </div>
            <div class="cur-opt" onclick="setCurrency('USD', event)">
              <span>$ Доллары</span><span>USD</span>
            </div>
            <div class="cur-opt" onclick="setCurrency('STARS', event)">
              <span>★ TG Stars</span><span>STARS</span>
            </div>
          </div>
        </div>

        <button class="dep-btn" onclick="openWalletModal('dep')">+ Пополнить</button>

        <div class="avatar-btn" onclick="go('/profile')" title="Профиль">
          <div class="avatar-inner" id="hdrAvatar">TG</div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="tma-main" id="app"></main>

    <!-- BOTTOM NAVIGATION (3 TABS: Игры, Кейсы, Профиль) -->
    <nav class="tma-nav">
      <div class="nav-item active" data-tab="games" onclick="go('/games')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4m-2-2v4m7-1h.01M18 11h.01"/></svg>
        <span>Игры</span>
      </div>
      <div class="nav-item" data-tab="cases" onclick="go('/cases')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
        <span>Кейсы</span>
      </div>
      <div class="nav-item" data-tab="profile" onclick="go('/profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>Профиль</span>
      </div>
    </nav>
  </div>

  <!-- UNIVERSAL MODAL SHEET -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
    <div class="modal-sheet" id="modalSheet" onclick="event.stopPropagation()"></div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-box" id="toastBox"></div>

  <script>
    /******************************************************************
     * 1. CURRENCIES, TELEGRAM NFT GIFTS & CASES DATA
     ******************************************************************/
    const CURRENCIES = {
      RUB:   { code: 'RUB',   sym: '₽', rate: 100, dec: 0 },
      USD:   { code: 'USD',   sym: '$', rate: 1,   dec: 2 },
      STARS: { code: 'STARS', sym: '★', rate: 50,  dec: 0 }
    };

    function tgNftUrl(slug) {
      if (!slug) return '';
      if (slug.startsWith('http') && !slug.includes('t.me/nft/')) return slug;
      const clean = slug.replace(/^https?:\/\/t\.me\/nft\//i, '').trim().toLowerCase();
      return 'https://nft.fragment.com/gift/' + clean + '.medium.webp';
    }

    const GIFTS = [
      { id: 'heart',  name: 'Lol Pop',        val: 0.50,   c: '#ec4899', nft: 'lolpop-1' },
      { id: 'cane',   name: 'Candy Cane',     val: 1.00,   c: '#f43f5e', nft: 'candycane-1' },
      { id: 'bells',  name: 'Jingle Bells',   val: 1.50,   c: '#eab308', nft: 'jinglebells-1' },
      { id: 'cake',   name: 'Homemade Cake',  val: 2.00,   c: '#f97316', nft: 'homemadecake-1' },
      { id: 'santa',  name: 'Santa Hat',      val: 3.00,   c: '#ef4444', nft: 'santahat-1' },
      { id: 'bear',   name: 'Toy Bear',       val: 5.00,   c: '#d97706', nft: 'toybear-1' },
      { id: 'bunny',  name: 'Jelly Bunny',    val: 8.00,   c: '#a855f7', nft: 'jellybunny-1' },
      { id: 'frog',   name: 'Kissed Frog',    val: 12.00,  c: '#10b981', nft: 'kissedfrog-1' },
      { id: 'potion', name: 'Love Potion',    val: 20.00,  c: '#ec4899', nft: 'lovepotion-1' },
      { id: 'cigar',  name: 'Vintage Cigar',  val: 28.00,  c: '#b45309', nft: 'vintagecigar-1' },
      { id: 'sword',  name: 'Light Sword',    val: 35.00,  c: '#38bdf8', nft: 'lightsword-1' },
      { id: 'oscar',  name: 'Mini Oscar',     val: 45.00,  c: '#facc15', nft: 'minioscar-1' },
      { id: 'hat',    name: 'Top Hat',        val: 55.00,  c: '#6366f1', nft: 'tophat-1' },
      { id: 'rose',   name: 'Eternal Rose',   val: 80.00,  c: '#e11d48', nft: 'eternalrose-1' },
      { id: 'peach',  name: 'Precious Peach', val: 95.00,  c: '#fb7185', nft: 'preciouspeach-1' },
      { id: 'shard',  name: 'Astral Shard',   val: 120.00, c: '#8b5cf6', nft: 'astralshard-1' },
      { id: 'locket', name: 'Heart Locket',   val: 150.00, c: '#f43f5e', nft: 'heartlocket-1' },
      { id: 'gem',    name: 'Signet Ring',    val: 180.00, c: '#3b82f6', nft: 'signetring-1' },
      { id: 'loot',   name: 'Loot Bag',       val: 250.00, c: '#10b981', nft: 'lootbag-1' },
      { id: 'ring',   name: 'Diamond Ring',   val: 300.00, c: '#60a5fa', nft: 'diamondring-1' },
      { id: 'watch',  name: 'Swiss Watch',    val: 420.00, c: '#f59e0b', nft: 'swisswatch-1' },
      { id: 'cap',    name: "Durov's Cap",    val: 650.00, c: '#2aabee', nft: 'durovscap-1' },
      { id: 'pepe',   name: 'Plush Pepe',     val: 1500.0, c: '#22c55e', nft: 'plushpepe-1' }
    ];

    const BALANCE_PRIZES_RUB = [1, 200, 300, 100, 500, 600, 999, 1500, 2000];

    const CASES = [
      {
        id: 'start',
        name: 'Кейс Новичка',
        price: 0.99,
        priceLabelRub: '99 руб',
        color: '#38bdf8',
        items: ['heart', 'cane', 'bells', 'cake', 'santa', 'bear']
      },
      {
        id: 'rich',
        name: 'Богач',
        price: 2.99,
        priceLabelRub: '299 руб',
        color: '#f59e0b',
        items: ['cake', 'santa', 'bear', 'bunny', 'frog', 'potion']
      },
      {
        id: 'frog',
        name: 'Лягушка',
        price: 4.99,
        priceLabelRub: '499 руб',
        color: '#10b981',
        items: ['cane', 'cake', 'bear', 'bunny', 'frog', 'potion', 'sword']
      },
      {
        id: 'allornothing',
        name: 'Всё или ничего',
        price: 9.99,
        priceLabelRub: '999 руб',
        color: '#e11d48',
        items: ['cane', 'rose']
      },
      {
        id: 'balance',
        name: 'Баланс',
        price: 9.99,
        priceLabelRub: '999 руб',
        color: '#22c55e',
        isBalanceCase: true,
        rubPrizes: BALANCE_PRIZES_RUB
      },
      {
        id: 'luxury',
        name: 'Лакшери',
        price: 23.99,
        priceLabelRub: '2.399 руб',
        color: '#a855f7',
        items: ['bear', 'frog', 'potion', 'cigar', 'sword', 'oscar', 'hat', 'rose']
      },
      {
        id: 'whale',
        name: 'Криптовалюта',
        price: 84.99,
        priceLabelRub: '8.499 руб',
        color: '#6366f1',
        items: ['potion', 'sword', 'hat', 'rose', 'peach', 'shard', 'gem', 'loot', 'ring']
      },
      {
        id: 'pepe',
        name: 'Plush Pepe',
        price: 239.99,
        priceLabelRub: '23.999 руб',
        color: '#10b981',
        items: ['rose', 'shard', 'locket', 'gem', 'loot', 'ring', 'watch', 'cap', 'pepe']
      }
    ];

    function getGift(id) {
      return GIFTS.find(g => g.id === id) || GIFTS[0];
    }

    function giftSVG(id) {
      const g = getGift(id);
      return `<svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="26" fill="${g.c}22" stroke="${g.c}" stroke-width="2"/>
        <path d="M20 28h24v18a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V28z" fill="${g.c}"/>
        <rect x="18" y="22" width="28" height="7" rx="2.5" fill="#fff"/>
        <path d="M32 22v28M25 18c0-3 3-5 7-1 4-4 7-2 7 1" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
      </svg>`;
    }

    function giftVisual(id) {
      const g = getGift(id);
      const url = tgNftUrl(g.nft);
      return `<div class="gift-thumb">
        <img src="${url}" alt="${g.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';" />
        <div style="display:none;width:100%;height:100%;">${giftSVG(id)}</div>
      </div>`;
    }

    function rubPrizeVisual(rubAmount) {
      return `<div class="gift-thumb">
        <div style="width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 30% 30%,rgba(34,197,94,0.35),rgba(16,185,129,0.1));border:1px solid rgba(34,197,94,0.5);display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:900;font-size:15px;color:#4ade80;">
          ₽
        </div>
      </div>`;
    }

    /******************************************************************
     * 2. STATE & PERSISTENCE
     ******************************************************************/
    const STORAGE_KEY = 'tg_grader_v3';
    let S = {
      bal: 50.00,
      cur: 'RUB',
      inv: [
        { uid: 'u1', id: 'cane' },
        { uid: 'u2', id: 'bear' },
        { uid: 'u3', id: 'frog' }
      ],
      stats: { played: 0, won: 0 },
      txs: [],
      tgUser: { name: 'TG Player', username: 'tg_player', photo: '' }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          S = Object.assign({}, S, parsed);
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
      } catch (e) {}
      updateHeaderUI();
    }

    function formatRubDots(num) {
      return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function fmtCur(usdVal, forceCur) {
      const c = CURRENCIES[forceCur || S.cur] || CURRENCIES.RUB;
      const val = usdVal * c.rate;
      if (c.code === 'RUB') {
        return formatRubDots(val) + ' руб';
      }
      if (c.code === 'STARS') {
        return Math.round(val).toLocaleString('ru-RU') + ' ★';
      }
      return '$' + val.toFixed(2);
    }

    function fmtHeaderBal(usdVal) {
      const c = CURRENCIES[S.cur] || CURRENCIES.RUB;
      const val = usdVal * c.rate;
      if (c.code === 'RUB') return formatRubDots(val);
      if (c.code === 'STARS') return Math.round(val).toLocaleString('ru-RU');
      return val.toFixed(2);
    }

    function toUsd(inputInCur) {
      const c = CURRENCIES[S.cur] || CURRENCIES.RUB;
      return (parseFloat(inputInCur) || 0) / c.rate;
    }

    function fromUsd(usdVal) {
      const c = CURRENCIES[S.cur] || CURRENCIES.RUB;
      const v = usdVal * c.rate;
      return c.dec === 0 ? Math.round(v) : parseFloat(v.toFixed(2));
    }

    function toast(msg) {
      const box = document.getElementById('toastBox');
      if (!box) return;
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }

    function updateHeaderUI() {
      const c = CURRENCIES[S.cur] || CURRENCIES.RUB;
      const symEl = document.getElementById('hdrCurSym');
      const balEl = document.getElementById('hdrBalVal');
      if (symEl) symEl.textContent = c.sym;
      if (balEl) balEl.textContent = fmtHeaderBal(S.bal);

      const av = document.getElementById('hdrAvatar');
      if (av) {
        if (S.tgUser.photo) {
          av.innerHTML = `<img src="${S.tgUser.photo}" alt="av"/>`;
        } else {
          av.textContent = (S.tgUser.name || 'TG').slice(0, 2).toUpperCase();
        }
      }
    }

    function toggleCurMenu(e) {
      e.stopPropagation();
      const dd = document.getElementById('curDropdown');
      if (dd) dd.classList.toggle('open');
    }

    function setCurrency(code, e) {
      if (e) e.stopPropagation();
      if (CURRENCIES[code]) {
        S.cur = code;
        saveState();
        const dd = document.getElementById('curDropdown');
        if (dd) dd.classList.remove('open');
        route();
      }
    }

    document.addEventListener('click', () => {
      const dd = document.getElementById('curDropdown');
      if (dd) dd.classList.remove('open');
    });

    /******************************************************************
     * 3. ROUTER & NAVIGATION
     ******************************************************************/
    let cleanupCurrentView = null;

    function go(path) {
      location.hash = '#' + path;
    }

    function route() {
      if (typeof cleanupCurrentView === 'function') {
        cleanupCurrentView();
        cleanupCurrentView = null;
      }
      const hash = (location.hash || '#/games').replace(/^#/, '');
      const app = document.getElementById('app');
      if (!app) return;

      document.querySelectorAll('.nav-item').forEach(btn => {
        const t = btn.getAttribute('data-tab');
        const isGames = hash.startsWith('/games') || ['/upgrade','/arena','/crash','/mines','/dice','/cars','/tower'].includes(hash);
        const isCases = hash.startsWith('/cases') || hash.startsWith('/case/');
        const isProfile = hash.startsWith('/profile');
        btn.classList.toggle('active',
          (t === 'games' && isGames) ||
          (t === 'cases' && isCases) ||
          (t === 'profile' && isProfile)
        );
      });

      try {
        if (hash === '/games' || hash === '/') renderGamesMenu(app);
        else if (hash === '/upgrade') renderUpgrader(app, false);
        else if (hash === '/arena') renderUpgrader(app, true);
        else if (hash === '/crash') renderCrash(app);
        else if (hash === '/mines') renderMines(app);
        else if (hash === '/dice') renderDice(app);
        else if (hash === '/cars') renderCars(app);
        else if (hash === '/tower') renderTower(app);
        else if (hash === '/cases') renderCasesList(app);
        else if (hash.startsWith('/case/')) renderCaseDetail(app, hash.split('/case/')[1]);
        else if (hash === '/profile') renderProfile(app);
        else renderGamesMenu(app);
      } catch (err) {
        console.error(err);
        renderGamesMenu(app);
      }
    }

    window.addEventListener('hashchange', route);

    /******************************************************************
     * 4. GAMES MENU (7 GAMES, NO DESCRIPTIONS, NO SLOTS)
     ******************************************************************/
    function renderGamesMenu(app) {
      const games = [
        { path: '/upgrade', name: 'Апгрейд',          icon: '⚡', tag: 'NFT',  c: '#38bdf8' },
        { path: '/crash',   name: 'Ракетка (crash)',  icon: '🚀', tag: 'LIVE', c: '#f43f5e' },
        { path: '/mines',   name: 'Мины',             icon: '💣', tag: '5x5',  c: '#f59e0b' },
        { path: '/dice',    name: 'Кубик (dice)',     icon: '🎲', tag: '96%',  c: '#10b981' },
        { path: '/cars',    name: 'Машинки',          icon: 'TG', tag: 'NEW',  c: '#06b6d4' },
        { path: '/arena',   name: 'Аренагрейд',       icon: '🏟️', tag: '2D',   c: '#a855f7' },
        { path: '/tower',   name: 'Башня',            icon: '🏰', tag: 'X',    c: '#eab308' }
      ];

      app.innerHTML = `
        <div class="anim-page">
          <div class="sec-head">
            <div class="sec-title">Игровые режимы</div>
            <button class="back-pill" onclick="openGiftShopModal()">🎁 Магазин подарков</button>
          </div>
          <div class="games-grid">
            ${games.map((g, idx) => `
              <div class="game-card" style="animation-delay:${idx * 0.04}s" onclick="go('${g.path}')">
                <div class="g-glow" style="background:${g.c};"></div>
                <span class="g-tag" style="background:${g.c}22;color:${g.c};border:1px solid ${g.c}44;">${g.tag}</span>
                <div class="g-icon" style="color:${g.c};font-family:'Unbounded',sans-serif;font-size:${g.icon === 'TG' ? '14px' : '20px'};">${g.icon}</div>
                <div class="g-name">${g.name}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /******************************************************************
     * 5. UPGRADER & ORIGINAL 2D SQUARE ARENAGRADE
     ******************************************************************/
    let upgState = {
      giveType: 'inv',
      giveUid: null,
      giveBalUsd: 2.00,
      targetGiftId: 'frog',
      busy: false
    };

    function renderUpgrader(app, isArena) {
      if (upgState.giveType === 'inv') {
        const exists = S.inv.find(i => i.uid === upgState.giveUid);
        if (!exists) upgState.giveUid = S.inv[0] ? S.inv[0].uid : null;
      }

      const giveVal = getUpgGiveUsd();
      const targetGift = getGift(upgState.targetGiftId);
      const rawChance = giveVal > 0 ? (giveVal / targetGift.val) * 92 : 0;
      const chance = Math.min(85, Math.max(1, rawChance));
      const mult = giveVal > 0 ? (targetGift.val / giveVal).toFixed(2) : '0.00';

      app.innerHTML = `
        <div class="anim-page">
          <div class="sec-head">
            <div class="sec-title">${isArena ? '🏟️ Аренагрейд' : '⚡ Апгрейд'}</div>
            <button class="back-pill" onclick="go('/games')">← Назад</button>
          </div>

          <div class="panel" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
            ${isArena ? `
              <div style="width:280px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px;">
                <span style="font-size:11px;font-weight:800;color:#10b981;">ШАНС: ${chance.toFixed(1)}%</span>
                <span class="font-display" style="font-size:11px;font-weight:800;color:#38bdf8;">x${mult}</span>
              </div>
              <canvas id="arenaCv" width="280" height="280" style="border-radius:18px;background:#080c15;border:2px solid rgba(255,255,255,0.12);box-shadow:0 10px 30px rgba(0,0,0,0.65) inset;"></canvas>
            ` : `
              <div style="position:relative;width:186px;height:186px;display:flex;align-items:center;justify-content:center;">
                <svg width="186" height="186" viewBox="0 0 200 200" style="transform:rotate(-90deg);">
                  <circle cx="100" cy="100" r="82" stroke="rgba(255,255,255,0.07)" stroke-width="14" fill="none"/>

    function runUpgrade(isArena, chance) {
      if (upgState.busy) return;
      const giveVal = getUpgGiveUsd();
      const target = getGift(upgState.targetGiftId);
      if (giveVal <= 0 || giveVal >= target.val) return;

      if (upgState.giveType === 'inv') {
        const idx = S.inv.findIndex(i => i.uid === upgState.giveUid);
        if (idx === -1) return;
        S.inv.splice(idx, 1);
      } else {
        if (S.bal < giveVal) {
          toast('Недостаточно баланса');
          return;
        }
        S.bal -= giveVal;
      }

      upgState.busy = true;
      S.stats.played++;
      saveState();

      const btn = document.getElementById('upgBtn');
      if (btn) btn.disabled = true;

      const win = (Math.random() * 100) < chance;

      if (!isArena) {
        const ptr = document.getElementById('upgWheelPtr');
        const winZoneDeg = (chance / 100) * 360;
        const targetDeg = win
          ? Math.random() * Math.max(4, winZoneDeg - 4) + 2
          : winZoneDeg + 6 + Math.random() * Math.max(8, (360 - winZoneDeg - 12));
        const totalDeg = 360 * 5 + targetDeg;
        if (ptr) ptr.style.transform = `rotate(${totalDeg}deg)`;

        setTimeout(() => finishUpgrade(win, target, false), 3500);
      } else {
        animateArenaBall(chance, win, () => finishUpgrade(win, target, true));
      }
    }

    function finishUpgrade(win, target, isArena) {
      upgState.busy = false;
      if (win) {
        const newUid = 'u_' + Date.now();
        S.inv.unshift({ uid: newUid, id: target.id });
        upgState.giveType = 'inv';
        upgState.giveUid = newUid;
        S.stats.won++;
        toast(`🎉 Успех! Выигран ${target.name}`);
      } else {
        upgState.giveUid = S.inv[0] ? S.inv[0].uid : null;
        toast('Не повезло в этот раз');
      }
      saveState();
      renderUpgrader(document.getElementById('app'), isArena);
    }

    /* ORIGINAL 2D SQUARE ARENA WITH BUMPER PINS & REAL BOUNCE PHYSICS */
    const ARENA_PINS = [
      { x: 86,  y: 86,  r: 10, hit: 0 },
      { x: 194, y: 86,  r: 10, hit: 0 },
      { x: 86,  y: 194, r: 10, hit: 0 },
      { x: 194, y: 194, r: 10, hit: 0 },
      { x: 140, y: 62,  r: 8,  hit: 0 },
      { x: 140, y: 218, r: 8,  hit: 0 },
      { x: 62,  y: 140, r: 8,  hit: 0 },
      { x: 218, y: 140, r: 8,  hit: 0 }
    ];

    function drawArenaStatic(chance, ball, trail = []) {
      const cv = document.getElementById('arenaCv');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const W = cv.width, H = cv.height;
      const cx = W / 2, cy = H / 2;
      const pad = 12;
      const boxS = W - pad * 2;
      ctx.clearRect(0, 0, W, H);

      const startA = -Math.PI / 2;
      const winAngle = (chance / 100) * Math.PI * 2;
      const endWinA = startA + winAngle;

      // 1. Clip to the 2D Square Arena Floor
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(pad, pad, boxS, boxS, 14);
      ctx.clip();

      // Green WIN Sector filling the square floor
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, W, startA, endWinA, false);
      ctx.closePath();
      ctx.fillStyle = 'rgba(16, 185, 129, 0.22)';
      ctx.fill();

      // Red LOSE Sector filling the rest of the square floor
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, W, endWinA, startA + Math.PI * 2, false);
      ctx.closePath();
      ctx.fillStyle = 'rgba(244, 63, 94, 0.16)';
      ctx.fill();

      // Subtle 2D cyber grid inside the square
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let x = pad; x <= W - pad; x += 28) {
        ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, H - pad); ctx.stroke();
      }
      for (let y = pad; y <= H - pad; y += 28) {
        ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
      }

      // Sector divider lines from center to walls
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(startA) * W, cy + Math.sin(startA) * W);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(endWinA) * W, cy + Math.sin(endWinA) * W);
      ctx.stroke();

      // Glowing Perimeter Wall Strip (Green on Win zone, Red on Lose zone)
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#10b981';
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, W, startA, endWinA, false);
      ctx.closePath();
      ctx.clip();
      ctx.beginPath();
      ctx.roundRect(pad + 2, pad + 2, boxS - 4, boxS - 4, 12);
      ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = '#f43f5e';
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, W, endWinA, startA + Math.PI * 2, false);
      ctx.closePath();
      ctx.clip();
      ctx.beginPath();
      ctx.roundRect(pad + 2, pad + 2, boxS - 4, boxS - 4, 12);
      ctx.stroke();
      ctx.restore();

      ctx.restore(); // end square clip

      // 2. Center launch turret
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
      ctx.stroke();

      // 3. Draw 8 Bumper Pins with hit glow
      ARENA_PINS.forEach(p => {
        if (p.hit > 0) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r + 6 * p.hit, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(56, 189, 248, ${p.hit * 0.7})`;
          ctx.lineWidth = 2;
          ctx.stroke();
          p.hit = Math.max(0, p.hit - 0.08);
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, p.r);
        grad.addColorStop(0, '#7dd3fc');
        grad.addColorStop(1, '#1e293b');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#38bdf8';
        ctx.stroke();
      });

      // 4. Draw Ball Trail
      if (trail.length > 1) {
        for (let i = 0; i < trail.length - 1; i++) {
          const alpha = (i / trail.length) * 0.55;
          ctx.beginPath();
          ctx.arc(trail[i].x, trail[i].y, 3 + (i / trail.length) * 3.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(250, 204, 21, ${alpha})`;
          ctx.fill();
        }
      }

      // 5. Draw Ball
      const bx = ball ? ball.x : cx;
      const by = ball ? ball.y : cy;
      ctx.save();
      ctx.shadowColor = '#facc15';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(bx, by, 7.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fde047';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();
    }

    let arenaAnimId = null;
    function animateArenaBall(chance, win, done) {
      cancelAnimationFrame(arenaAnimId);
      const W = 280, H = 280, cx = 140, cy = 140;
      const minBound = 24, maxBound = W - 24;

      // Pick a final resting spot inside the target zone (WIN = green sector, LOSE = red sector)
      const startA = -Math.PI / 2;
      const winRad = (chance / 100) * Math.PI * 2;
      const margin = Math.min(0.12, winRad * 0.2);
      const finalAngle = win
        ? startA + margin + Math.random() * Math.max(0.02, winRad - margin * 2)
        : startA + winRad + 0.12 + Math.random() * Math.max(0.05, (Math.PI * 2 - winRad - 0.24));

      const stopDist = 78 + Math.random() * 28;
      let targetX = Math.max(30, Math.min(250, cx + Math.cos(finalAngle) * stopDist));
      let targetY = Math.max(30, Math.min(250, cy + Math.sin(finalAngle) * stopDist));

      // Keep target away from bumper pins so it doesn't overlap a pin when stopped
      ARENA_PINS.forEach(p => {
        const dx = targetX - p.x, dy = targetY - p.y;
        const d = Math.hypot(dx, dy);
        if (d < p.r + 14) {
          const pushA = Math.atan2(dy, dx);
          targetX = p.x + Math.cos(pushA) * (p.r + 15);
          targetY = p.y + Math.sin(pushA) * (p.r + 15);
        }
      });

      const launchAngle = Math.random() * Math.PI * 2;
      const ball = {
        x: cx,
        y: cy,
        vx: Math.cos(launchAngle) * 11.5,
        vy: Math.sin(launchAngle) * 11.5,
        r: 7.5
      };

      const trail = [];
      let frame = 0;
      const totalFrames = 175;

      function step() {
        frame++;
        const progress = frame / totalFrames;

        if (progress < 0.72) {
          // Pure chaotic 2D physics phase: bouncing off square walls and bumper pins
          ball.x += ball.vx;
          ball.y += ball.vy;
          ball.vx *= 0.991;
          ball.vy *= 0.991;

          // Square wall collisions
          if (ball.x < minBound) { ball.x = minBound; ball.vx = Math.abs(ball.vx) * 0.92; }
          if (ball.x > maxBound) { ball.x = maxBound; ball.vx = -Math.abs(ball.vx) * 0.92; }
          if (ball.y < minBound) { ball.y = minBound; ball.vy = Math.abs(ball.vy) * 0.92; }
          if (ball.y > maxBound) { ball.y = maxBound; ball.vy = -Math.abs(ball.vy) * 0.92; }

          // Bumper pin collisions
          ARENA_PINS.forEach(p => {
            const dx = ball.x - p.x;
            const dy = ball.y - p.y;
            const dist = Math.hypot(dx, dy);
            const minDist = ball.r + p.r;
            if (dist < minDist && dist > 0.001) {
              const nx = dx / dist;
              const ny = dy / dist;
              ball.x = p.x + nx * (minDist + 1);
              ball.y = p.y + ny * (minDist + 1);
              const dot = ball.vx * nx + ball.vy * ny;
              ball.vx = (ball.vx - 2 * dot * nx) * 0.96 + (Math.random() - 0.5) * 1.2;
              ball.vy = (ball.vy - 2 * dot * ny) * 0.96 + (Math.random() - 0.5) * 1.2;
              p.hit = 1.0;
            }
          });
        } else {
          // Smooth physical roll-out phase into the exact outcome sector
          const t = (progress - 0.72) / 0.28;
          const ease = 1 - Math.pow(1 - t, 3);
          ball.x += (targetX - ball.x) * (0.09 + ease * 0.18);
          ball.y += (targetY - ball.y) * (0.09 + ease * 0.18);

          // Still respect bumper pin edges while rolling to a stop
          ARENA_PINS.forEach(p => {
            const dx = ball.x - p.x;
            const dy = ball.y - p.y;
            const dist = Math.hypot(dx, dy);
            const minDist = ball.r + p.r;
            if (dist < minDist && dist > 0.001) {
              ball.x = p.x + (dx / dist) * (minDist + 1);
              ball.y = p.y + (dy / dist) * (minDist + 1);
              p.hit = 0.7;
            }
          });
        }

        trail.push({ x: ball.x, y: ball.y });
        if (trail.length > 14) trail.shift();

        drawArenaStatic(chance, ball, trail);

        if (frame < totalFrames) {
          arenaAnimId = requestAnimationFrame(step);
        } else {
          drawArenaStatic(chance, { x: targetX, y: targetY }, []);
          done();
        }
      }

      arenaAnimId = requestAnimationFrame(step);
    }

    /******************************************************************
     * 6. CRASH (РАКЕТКА - SMALLER X FONT & BALANCED CURVE)
     ******************************************************************/
    let crashTimer = null;
    function renderCrash(app) {
      let running = false, cashed = false, mult = 1.00, crashAt = 1.00, betUsd = 1.00;

      app.innerHTML = `
        <div class="anim-page">
          <div class="sec-head">
            <div class="sec-title">🚀 Ракетка (Crash)</div>
            <button class="back-pill" onclick="go('/games')">← Назад</button>
          </div>

          <div class="panel" style="position:relative;text-align:center;padding:18px 12px;">
            <canvas id="crashCv" width="320" height="150" style="width:100%;height:150px;display:block;"></canvas>
            <div style="position:absolute;top:24px;left:0;right:0;pointer-events:none;">
              <div class="font-display" id="crashMult" style="font-size:21px;font-weight:900;color:#38bdf8;">1.00x</div>
              <div id="crashStatus" style="font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;">Готов к запуску</div>
            </div>
          </div>

          <div class="panel">
            <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Ставка (${S.cur}):</div>
            <div class="bet-bar">
              <input type="number" id="crashBetInp" value="${fromUsd(1)}" step="any" />
              <span class="bet-chip" onclick="adjBet('crashBetInp',0.5)">1/2</span>
              <span class="bet-chip" onclick="adjBet('crashBetInp',2)">x2</span>
              <span class="bet-chip" onclick="adjBetMax('crashBetInp')">MAX</span>
            </div>
            <button class="btn-main" id="crashBtn">Запустить</button>
          </div>
        </div>
      `;

      const multEl = document.getElementById('crashMult');
      const stEl = document.getElementById('crashStatus');
      const btn = document.getElementById('crashBtn');
      const cv = document.getElementById('crashCv');
      const ctx = cv.getContext('2d');

      function drawRocket(progress, crashed) {
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.strokeStyle = crashed ? '#f43f5e' : '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(18, cv.height - 18);
        const ex = 18 + Math.min(1, progress) * (cv.width - 52);
        const ey = (cv.height - 18) - Math.pow(Math.min(1, progress), 1.35) * (cv.height - 46);
        ctx.quadraticCurveTo(ex * 0.55, cv.height - 18, ex, ey);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ex, ey, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = crashed ? '#f43f5e' : '#38bdf8';
        ctx.fill();
      }

      drawRocket(0, false);

      btn.onclick = () => {
        if (!running) {
          const inp = document.getElementById('crashBetInp');
          betUsd = toUsd(inp.value);
          if (betUsd <= 0 || betUsd > S.bal) return toast('Недостаточно средств');
          S.bal -= betUsd;
          S.stats.played++;
          saveState();

          running = true;
          cashed = false;
          mult = 1.00;
          const r = Math.random();
          crashAt = r < 0.05 ? 1.00 : parseFloat(Math.min(15, (0.97 / (1 - r))).toFixed(2));

          btn.textContent = 'Забрать';
          btn.className = 'btn-main btn-green';
          multEl.style.color = '#38bdf8';
          stEl.textContent = 'Полет идет...';

          crashTimer = setInterval(() => {
            mult = parseFloat((mult + 0.015 * Math.pow(mult, 0.55)).toFixed(2));
            multEl.textContent = mult.toFixed(2) + 'x';
            if (!cashed) {
              btn.textContent = `Забрать ${fmtCur(betUsd * mult)}`;
            }
            drawRocket((mult - 1) / 5, false);

            if (mult >= crashAt) {
              clearInterval(crashTimer);
              running = false;
              multEl.textContent = crashAt.toFixed(2) + 'x';
              multEl.style.color = '#f43f5e';
              stEl.textContent = cashed ? 'Успешно забрано!' : 'Улетела!';
              drawRocket((mult - 1) / 5, true);
              btn.textContent = 'Запустить';
              btn.className = 'btn-main';
              btn.disabled = false;
            }
          }, 60);
        } else if (!cashed) {
          cashed = true;
          const winUsd = betUsd * mult;
          S.bal += winUsd;
          S.stats.won++;
          saveState();
          toast(`Выигрыш: ${fmtCur(winUsd)} (x${mult.toFixed(2)})`);
          btn.textContent = 'Ожидание конца раунда...';
          btn.disabled = true;
        }
      };

      cleanupCurrentView = () => clearInterval(crashTimer);
    }

      el.value = Math.max(1, Math.round(curVal * factor * 100) / 100);

     * 7. MINES (5x5 МИНЫ - COMPACT X)
     ******************************************************************/
    function renderMines(app) {
      let active = false, minesCount = 3, bombs = [], revealed = [], betUsd = 1.00;

      app.innerHTML = `
        <div class="anim-page">
          <div class="sec-head">
            <div class="sec-title">💣 Мины</div>
            <button class="back-pill" onclick="go('/games')">← Назад</button>
          </div>

          <div class="panel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span style="font-size:11px;color:var(--muted);font-weight:700;">Текущий икс:</span>
              <span class="font-display" id="minesMult" style="font-size:13px;color:#10b981;font-weight:900;">1.00x</span>
            </div>
            <div class="mines-grid" id="minesGrid"></div>
          </div>

          <div class="panel">
            <div style="display:flex;gap:5px;margin-bottom:10px;" id="mineCntRow">
              ${[1, 3, 5, 8, 12].map(n => `
                <button class="bet-chip" data-mc="${n}" style="flex:1;padding:7px;${n===3?'border-color:#38bdf8;color:#fff;':''}">${n} 💣</button>
              `).join('')}
            </div>

            <div class="bet-bar">
              <input type="number" id="minesBetInp" value="${fromUsd(1)}" step="any" />
              <span class="bet-chip" onclick="adjBet('minesBetInp',0.5)">1/2</span>
              <span class="bet-chip" onclick="adjBet('minesBetInp',2)">x2</span>
            </div>

            <button class="btn-main" id="minesActionBtn">Начать игру</button>
          </div>
        </div>
      `;

      const gridEl = document.getElementById('minesGrid');
      const multEl = document.getElementById('minesMult');
      const btn = document.getElementById('minesActionBtn');

      function calcMult(steps) {
        if (steps === 0) return 1.00;
        let m = 0.96;
        for (let i = 0; i < steps; i++) {
          m *= (25 - i) / (25 - minesCount - i);
        }
        return parseFloat(Math.max(1.04, m * 0.92).toFixed(2));
      }

      function drawBoard(showAll) {
        gridEl.innerHTML = '';
        for (let i = 0; i < 25; i++) {
          const d = document.createElement('div');
          const isRev = revealed.includes(i);
          const isBomb = bombs.includes(i);
          d.className = 'mine-tile' + (isRev ? (isBomb ? ' bomb' : ' safe') : '');
          if (isRev || (showAll && isBomb)) {
            d.textContent = isBomb ? '💣' : '💎';
          }
          d.onclick = () => clickTile(i);
          gridEl.appendChild(d);
        }
      }

      function clickTile(idx) {
        if (!active || revealed.includes(idx)) return;
        revealed.push(idx);
        if (bombs.includes(idx)) {
          active = false;
          drawBoard(true);
          toast('Взрыв на мине!');
          btn.textContent = 'Начать игру';
          btn.className = 'btn-main';
          multEl.textContent = '0.00x';
        } else {
          const m = calcMult(revealed.length);
          multEl.textContent = m.toFixed(2) + 'x';
          btn.textContent = `Забрать ${fmtCur(betUsd * m)}`;
          drawBoard(false);
        }
      }

      document.querySelectorAll('[data-mc]').forEach(b => {
        b.onclick = () => {
          if (active) return;
          minesCount = parseInt(b.getAttribute('data-mc'));
          document.querySelectorAll('[data-mc]').forEach(x => {
            x.style.borderColor = 'var(--border)';
            x.style.color = 'var(--muted)';
          });
          b.style.borderColor = '#38bdf8';
          b.style.color = '#fff';
        };
      });

      btn.onclick = () => {
        if (!active) {
          betUsd = toUsd(document.getElementById('minesBetInp').value);
          if (betUsd <= 0 || betUsd > S.bal) return toast('Недостаточно средств');
          S.bal -= betUsd;
          S.stats.played++;
          saveState();

          active = true;
          revealed = [];
          bombs = [];
          while (bombs.length < minesCount) {
            const r = Math.floor(Math.random() * 25);
            if (!bombs.includes(r)) bombs.push(r);
          }
          multEl.textContent = '1.00x';
          btn.textContent = 'Открой ячейку...';
          btn.className = 'btn-main btn-green';
          drawBoard(false);
        } else {
          if (revealed.length === 0) return toast('Открой хотя бы 1 ячейку');
          const m = calcMult(revealed.length);
          const winUsd = betUsd * m;
          S.bal += winUsd;
          S.stats.won++;
          active = false;
          saveState();
          drawBoard(true);
          toast(`Выигрыш: ${fmtCur(winUsd)}`);
          btn.textContent = 'Начать игру';
          btn.className = 'btn-main';
        }
      };

      drawBoard(false);
    }

      let laneCol = -1;
      let heroRow = 2;
      let betUsd = 1.00;
      let crashedCol = -1;
      let carPositions = [0, 3, 1, 4, 2];

      app.innerHTML = `

      const multHdrEl = document.getElementById('carsMultHeader');

      const curMultEl = document.getElementById('carsCurMult');
      const stepBtn = document.getElementById('carsStepBtn');
      const cashBtn = document.getElementById('carsCashBtn');

      function drawRoad() {
        multHdrEl.innerHTML = `<div class="cars-mult-cell">СТАРТ</div>` + mults.map((m, idx) => `
          <div class="cars-mult-cell ${idx === laneCol ? 'active' : (idx < laneCol ? 'passed' : '')}">${m.toFixed(2)}x</div>
        `).join('');

        let html = '';
        for (let r = 0; r < 5; r++) {
          const isHeroAtStart = (laneCol === -1 && r === heroRow);
          html += `
            <div class="cars-row">
              <div class="cars-start-x ${r === heroRow ? 'selected-row' : ''}" onclick="selectCarRow(${r})">
                ${isHeroAtStart ? '<span class="tg-hero-badge">TG</span>' : 'X'}
              </div>
              ${mults.map((m, c) => {
                const isHeroHere = (laneCol === c && r === heroRow);
                const isCrashCell = (crashedCol === c && r === heroRow);
                const hasCar = (carPositions[c] === r) && !isHeroHere;
                const colClass = isCrashCell ? 'col-crash' : (c === laneCol ? 'col-current' : (c < laneCol ? 'col-passed' : ''));
                return `
                  <div class="cars-lane-cell ${colClass}">
                    ${isHeroHere ? `<span class="tg-hero-badge ${isCrashCell ? 'crashed' : ''}">TG</span>` : (hasCar ? `<div class="car-block ${c === crashedCol ? 'danger' : ''}"></div>` : '')}
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }
        rowsWrapEl.innerHTML = html;
      }

      window.selectCarRow = (r) => {
        heroRow = r;
        drawRoad();
      };

      function doCashout(m) {
        const win = betUsd * m;
        S.bal += win;
        S.stats.won++;
        active = false;
        laneCol = -1;
        crashedCol = -1;
        saveState();
        toast(`Забрано: ${fmtCur(win)} (x${m.toFixed(2)})`);
        curMultEl.textContent = '1.00x';
        cashBtn.disabled = true;
        cashBtn.textContent = 'Забрать';
        drawRoad();

          S.stats.played++;
          saveState();
          active = true;
          laneCol = -1;
          crashedCol = -1;
        }

        const nextCol = laneCol + 1;
        const hit = Math.random() < 0.22;
        carPositions = mults.map((_, idx) => {
          if (idx === nextCol) {
            if (hit) return heroRow;
            return (heroRow + 1 + Math.floor(Math.random() * 4)) % 5;
          }
          return Math.floor(Math.random() * 5);
        });

        laneCol = nextCol;

          cashBtn.textContent = 'Забрать';
          curMultEl.textContent = '0.00x';

          curMultEl.textContent = curM.toFixed(2) + 'x';
          cashBtn.disabled = false;
          cashBtn.textContent = `Забрать ${fmtCur(betUsd * curM)}`;
          drawRoad();
          if (laneCol === mults.length - 1) {
            doCashout(curM);
          }
        }
      };

      cashBtn.onclick = () => {
        if (!active || laneCol < 0) return;
        doCashout(mults[laneCol]);
      };

      drawRoad();
      setTimeout(showCarsBugWarningModal, 60);
    }

    /******************************************************************
     * 10. TOWER (БАШНЯ 5-4-3-4-5-4-3-4-5 X-СЛОТЫ, COMPACT X)
     ******************************************************************/
    function renderTower(app) {
      const floorSlotCounts = [5, 4, 3, 4, 5, 4, 3, 4, 5];
      const floorMults = [1.14, 1.32, 1.58, 1.88, 2.22, 2.65, 3.20, 3.85, 4.60];
      let active = false, curFloor = 0, betUsd = 1.00, floorData = [];

      app.innerHTML = `
        <div class="anim-page">
          <div class="sec-head">
            <div class="sec-title">🏰 Башня</div>
            <button class="back-pill" onclick="go('/games')">← Назад</button>
          </div>

          <div class="panel">
            <div class="tower-wrap" id="towerWrap"></div>
          </div>

          <div class="panel">
            <div class="bet-bar">
              <input type="number" id="towerBetInp" value="${fromUsd(1)}" step="any" />
              <span class="bet-chip" onclick="adjBet('towerBetInp',0.5)">1/2</span>
              <span class="bet-chip" onclick="adjBet('towerBetInp',2)">x2</span>
            </div>
            <button class="btn-main" id="towerBtn">Начать подъем</button>
          </div>
        </div>
      `;

      const wrap = document.getElementById('towerWrap');
      const btn = document.getElementById('towerBtn');

      function drawTower(revealAll) {
        wrap.innerHTML = '';
        for (let f = floorSlotCounts.length - 1; f >= 0; f--) {
          const slotsCnt = floorSlotCounts[f];
          const row = document.createElement('div');
          row.className = 'tower-floor' + (active && f === curFloor ? ' active-floor' : (f < curFloor ? ' passed-floor' : ''));

          let slotsHtml = '';
          for (let c = 0; c < slotsCnt; c++) {
            const fd = floorData[f];
            let cls = 'tower-x-slot';
            let txt = 'X';
            if (fd && fd.picked !== null) {
              if (c === fd.bomb) { cls += ' trap'; txt = '✕'; }
              else if (c === fd.picked) { cls += ' safe'; txt = 'X'; }
            } else if (revealAll && fd && c === fd.bomb) {
              cls += ' trap';
              txt = '✕';
            }
            slotsHtml += `<div class="${cls}" onclick="pickTowerTile(${f},${c})">${txt}</div>`;
          }

          row.innerHTML = `
            <div class="tower-mult">${floorMults[f].toFixed(2)}x</div>
            <div class="tower-slots-row">${slotsHtml}</div>
          `;
          wrap.appendChild(row);
        }
      }

      window.pickTowerTile = (f, c) => {
        if (!active || f !== curFloor) return;
        const fd = floorData[f];
        fd.picked = c;
        if (c === fd.bomb) {
          active = false;
          drawTower(true);
          toast('Ловушка! Подъем окончен');
          btn.textContent = 'Начать подъем';
          btn.className = 'btn-main';
        } else {
          const m = floorMults[curFloor];
          curFloor++;
          if (curFloor >= floorSlotCounts.length) {
            const win = betUsd * m;
            S.bal += win;
            S.stats.won++;
            active = false;
            saveState();
            drawTower(true);
            toast(`Вершина взята! +${fmtCur(win)}`);
            btn.textContent = 'Начать подъем';
            btn.className = 'btn-main';
          } else {
            btn.textContent = `Забрать ${fmtCur(betUsd * m)}`;
            drawTower(false);
          }
        }
      };

      btn.onclick = () => {
        if (!active) {
          betUsd = toUsd(document.getElementById('towerBetInp').value);
          if (betUsd <= 0 || betUsd > S.bal) return toast('Недостаточно средств');
          S.bal -= betUsd;
          S.stats.played++;
          saveState();

          active = true;
          curFloor = 0;
          floorData = floorSlotCounts.map(cnt => ({
            bomb: Math.floor(Math.random() * cnt),
            picked: null
          }));
          btn.textContent = 'Выбери X на 1 этаже';
          btn.className = 'btn-main btn-green';
          drawTower(false);
        } else {
          if (curFloor === 0) return toast('Пройди хотя бы 1 этаж');
          const m = floorMults[curFloor - 1];
          const win = betUsd * m;
          S.bal += win;
          S.stats.won++;
          active = false;
          saveState();
          drawTower(true);
          toast(`Выигрыш: ${fmtCur(win)}`);
          btn.textContent = 'Начать подъем';
          btn.className = 'btn-main';
        }
      };

      drawTower(false);
    }
