                : giftVisual(c.items[c.items.length - 1]);
              return `
                <div class="game-card" style="animation-delay:${idx * 0.04}s;align-items:center;text-align:center;" onclick="go('/case/${c.id}')">
                  <div class="g-glow" style="background:${c.color};"></div>
                  ${previewVisual}
                  <div class="g-name" style="margin-top:6px;">${c.name}</div>
                  <div style="margin-top:8px;padding:5px 12px;border-radius:99px;background:${c.color}22;color:${c.color};font-size:11px;font-weight:800;">
                    ${formatCasePrice(c)}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderCaseDetail(app, cid) {
      const c = CASES.find(x => x.id === cid) || CASES[0];
      let spinning = false;

      const buildTrackCard = (entry) => {
        if (c.isBalanceCase) {
          return `
            <div class="r-card">
              ${rubPrizeVisual(entry)}
              <div class="gift-name">${formatRubDots(entry)} руб</div>
            </div>
          `;
        }
        const g = getGift(entry);
        return `
          <div class="r-card">
            ${giftVisual(g.id)}
            <div class="gift-name">${g.name}</div>
          </div>
        `;
      };

      const initialStrip = Array.from({ length: 18 }, (_, i) => {
        const pool = c.isBalanceCase ? c.rubPrizes : c.items;
        return buildTrackCard(pool[i % pool.length]);
      }).join('');

      const contentsGridHtml = c.isBalanceCase
        ? c.rubPrizes.map(rub => `
            <div class="gift-item">
              ${rubPrizeVisual(rub)}
              <div class="gift-name">${formatRubDots(rub)} руб</div>
              <div class="gift-val">На баланс</div>
            </div>
          `).join('')
        : c.items.map(id => {
            const g = getGift(id);
            return `
              <div class="gift-item">
                ${giftVisual(g.id)}
                <div class="gift-name">${g.name}</div>
                <div class="gift-val">${fmtCur(g.val)}</div>
              </div>
            `;
          }).join('');

      app.innerHTML = `
        <div class="anim-page">
          <div class="sec-head">
            <div class="sec-title">${c.name}</div>
            <button class="back-pill" onclick="go('/cases')">← Все кейсы</button>
          </div>

          <div class="panel">
            <div class="roulette-window">
              <div class="roulette-pointer"></div>
              <div class="roulette-track" id="caseTrack">${initialStrip}</div>
            </div>

            <button class="btn-main" id="openCaseBtn">Открыть за ${formatCasePrice(c)}</button>
          </div>

          <div class="panel">
            <div style="font-size:11px;font-weight:800;color:var(--muted);margin-bottom:8px;">СОДЕРЖИМОЕ КЕЙСА</div>
            <div class="gift-grid">${contentsGridHtml}</div>
          </div>
        </div>
      `;

      document.getElementById('openCaseBtn').onclick = () => {
        if (spinning) return;
        if (S.bal < c.price) return toast('Недостаточно баланса');

        S.bal -= c.price;
        S.stats.played++;
        saveState();
        spinning = true;

        const btn = document.getElementById('openCaseBtn');
        btn.disabled = true;

        const track = document.getElementById('caseTrack');
        const winIdx = 32;

        if (c.isBalanceCase) {
          const weights = c.rubPrizes.map(r => 1 / Math.pow(Math.max(50, r), 0.75));
          const sumW = weights.reduce((a, b) => a + b, 0);
          let rnd = Math.random() * sumW;
          let wonRub = c.rubPrizes[0];
          for (let i = 0; i < c.rubPrizes.length; i++) {
            rnd -= weights[i];
            if (rnd <= 0) { wonRub = c.rubPrizes[i]; break; }
          }

          const cards = [];
          for (let i = 0; i < 42; i++) {
            const p = i === winIdx ? wonRub : c.rubPrizes[Math.floor(Math.random() * c.rubPrizes.length)];
            cards.push(buildTrackCard(p));
          }
          track.style.transition = 'none';
          track.style.transform = 'translateX(0px)';
          track.innerHTML = cards.join('');

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              const cardW = 90;
              const viewW = track.parentElement.clientWidth;
              const offset = (winIdx * cardW) - (viewW / 2) + 48 + (Math.random() * 20 - 10);
              track.style.transition = 'transform 4.1s cubic-bezier(0.1, 0.85, 0.15, 1)';
              track.style.transform = `translateX(-${offset}px)`;
            });
          });

          setTimeout(() => {
            const wonUsd = wonRub / CURRENCIES.RUB.rate;
            S.bal += wonUsd;
            S.stats.won++;
            saveState();
            toast(`🎉 Выпало ${formatRubDots(wonRub)} руб на баланс!`);
            spinning = false;
            btn.disabled = false;
          }, 4250);

        } else {
          const weights = c.items.map(id => 1 / Math.pow(getGift(id).val, 0.68));
          const sumW = weights.reduce((a, b) => a + b, 0);
          let rnd = Math.random() * sumW;
          let wonId = c.items[0];
          for (let i = 0; i < c.items.length; i++) {
            rnd -= weights[i];
            if (rnd <= 0) { wonId = c.items[i]; break; }
          }

          const cards = [];
          for (let i = 0; i < 42; i++) {
            const id = i === winIdx ? wonId : c.items[Math.floor(Math.random() * c.items.length)];
            cards.push(buildTrackCard(id));
          }
          track.style.transition = 'none';
          track.style.transform = 'translateX(0px)';
          track.innerHTML = cards.join('');

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              const cardW = 90;
              const viewW = track.parentElement.clientWidth;
              const offset = (winIdx * cardW) - (viewW / 2) + 48 + (Math.random() * 20 - 10);
              track.style.transition = 'transform 4.1s cubic-bezier(0.1, 0.85, 0.15, 1)';
              track.style.transform = `translateX(-${offset}px)`;
            });
          });

          setTimeout(() => {
            const wonGift = getGift(wonId);
            S.inv.unshift({ uid: 'u_' + Date.now(), id: wonId });
            S.stats.won++;
            saveState();
            toast(`🎉 Выпал ${wonGift.name} (${fmtCur(wonGift.val)})!`);
            spinning = false;
            btn.disabled = false;
          }, 4250);
        }
      };
    }

    /******************************************************************
     * 12. PROFILE, INVENTORY & BUY GIFTS WITH BALANCE
     ******************************************************************/
    function renderProfile(app) {
      const invTotalUsd = S.inv.reduce((s, i) => s + getGift(i.id).val, 0);

      app.innerHTML = `
        <div class="anim-page">
          <div class="panel" style="display:flex;align-items:center;gap:12px;">
            <div class="avatar-btn" style="width:54px;height:54px;">
              <div class="avatar-inner" style="font-size:18px;">
                ${S.tgUser.photo ? `<img src="${S.tgUser.photo}"/>` : (S.tgUser.name || 'TG').slice(0,2).toUpperCase()}
              </div>
            </div>
            <div style="flex:1;">
              <div class="font-display" style="font-size:15px;font-weight:800;">${S.tgUser.name}</div>
              <div style="font-size:11px;color:var(--muted);">@${S.tgUser.username}</div>
            </div>
            <button class="dep-btn" onclick="openWalletModal('dep')">Кошелёк</button>
          </div>

          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;">
            <div class="panel" style="margin:0;text-align:center;">
              <div style="font-size:10px;color:var(--muted);">БАЛАНС</div>
              <div class="font-display" style="font-size:12px;color:#38bdf8;margin-top:3px;">${fmtCur(S.bal)}</div>
            </div>
            <div class="panel" style="margin:0;text-align:center;">
              <div style="font-size:10px;color:var(--muted);">ИНВЕНТАРЬ</div>
              <div class="font-display" style="font-size:12px;color:#10b981;margin-top:3px;">${fmtCur(invTotalUsd)}</div>
            </div>
            <div class="panel" style="margin:0;text-align:center;">
              <div style="font-size:10px;color:var(--muted);">ИГР</div>
              <div class="font-display" style="font-size:12px;color:#fff;margin-top:3px;">${S.stats.played}</div>
            </div>
          </div>

          <div class="panel">
            <div class="sec-head">
              <div class="sec-title" style="font-size:13px;">🎒 Инвентарь (${S.inv.length})</div>
              <div style="display:flex;gap:6px;">
                <button class="back-pill" style="color:#38bdf8;border-color:rgba(56,189,248,0.35);" onclick="openGiftShopModal()">+ Купить подарок</button>
                ${S.inv.length > 0 ? `<button class="back-pill" onclick="sellAllGifts()">Продать всё</button>` : ''}
              </div>
            </div>

            ${S.inv.length === 0 ? `
              <div style="text-align:center;padding:24px 10px;color:var(--muted);font-size:12px;">
                У вас пока нет подарков в инвентаре.
              </div>
            ` : `
              <div class="gift-grid">
                ${S.inv.map(item => {
                  const g = getGift(item.id);
                  return `
                    <div class="gift-item">
                      ${giftVisual(g.id)}
                      <div class="gift-name">${g.name}</div>
                      <div class="gift-val">${fmtCur(g.val)}</div>
                      <div style="display:flex;gap:4px;margin-top:6px;">
                        <button class="bet-chip" style="flex:1;padding:4px;color:#10b981;" onclick="sellGift('${item.uid}')">Продать</button>
                        <button class="bet-chip" style="flex:1;padding:4px;color:#38bdf8;" onclick="withdrawGift('${item.uid}')">Вывод</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function sellGift(uid) {
      const idx = S.inv.findIndex(i => i.uid === uid);
      if (idx === -1) return;
      const g = getGift(S.inv[idx].id);
      S.inv.splice(idx, 1);
      S.bal += g.val;
      saveState();
      toast(`Продано: ${g.name} (+${fmtCur(g.val)})`);
      route();
    }

    function sellAllGifts() {
      if (S.inv.length === 0) return;
      const total = S.inv.reduce((s, i) => s + getGift(i.id).val, 0);
      S.inv = [];
      S.bal += total;
      saveState();
      toast(`Все подарки проданы (+${fmtCur(total)})`);
      route();
    }

    function withdrawGift(uid) {
      const idx = S.inv.findIndex(i => i.uid === uid);
      if (idx === -1) return;
      const g = getGift(S.inv[idx].id);
      S.inv.splice(idx, 1);
      saveState();
      toast(`Заявка на вывод ${g.name} в ваш Telegram отправлена!`);
      route();
    }

    function openGiftShopModal(fromArena) {
      const sheet = document.getElementById('modalSheet');
      document.getElementById('modalBackdrop').classList.add('open');

      sheet.innerHTML = `
        <div class="sec-head">
          <div class="sec-title">🎁 Магазин NFT Подарков</div>
          <button class="back-pill" onclick="closeModal()">✕ Закрыть</button>
        </div>
        <div class="gift-grid">
          ${GIFTS.map(g => `
            <div class="gift-item" onclick="buyGiftWithBal('${g.id}', ${fromArena})">
              ${giftVisual(g.id)}
              <div class="gift-name">${g.name}</div>
              <div class="gift-val">${fmtCur(g.val)}</div>
              <button class="bet-chip" style="width:100%;margin-top:5px;color:#fff;background:rgba(42,171,238,0.2);border-color:#2aabee;">Купить</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function buyGiftWithBal(giftId, fromArena) {
      const g = getGift(giftId);
      if (S.bal < g.val) {
        toast('Недостаточно средств на балансе');
        return;
      }
      S.bal -= g.val;
      const newUid = 'u_' + Date.now();
      S.inv.unshift({ uid: newUid, id: g.id });
      upgState.giveType = 'inv';
      upgState.giveUid = newUid;
      saveState();
      toast(`Куплен ${g.name} в инвентарь!`);
      closeModal();
      route();
    }

    /******************************************************************
     * 13. WALLET MODAL (ПОПОЛНЕНИЕ И ВЫВОД)
     ******************************************************************/
    const PAY_M = {
      sbp:   { name: 'СБП (РФ Банки)', req: '+7 (995) 841-29-10 • Т-Банк / Сбер' },
      stars: { name: 'Telegram Stars ★', req: '@tg_grader_stars_bot' },
      ton:   { name: 'TON Connect / Кошелёк', req: 'UQBv9tggrader7x92kLmQp81aZvT09sHj291kLp0' },
      usdt:  { name: 'USDT (TRC-20 / TON)', req: 'TX9tggrader84JkL91mNpQ72vXz8192Labc' },
      gift:  { name: 'Подарком в Telegram', req: 'Передайте NFT подарок на @tg_grader_relayer' }
    };

    function openWalletModal(tab = 'dep', method = 'sbp') {
      const sheet = document.getElementById('modalSheet');
      document.getElementById('modalBackdrop').classList.add('open');
      const pm = PAY_M[method] || PAY_M.sbp;

      sheet.innerHTML = `
        <div class="sec-head">
          <div class="sec-title">💳 Кошелёк TG Grader</div>
          <button class="back-pill" onclick="closeModal()">✕</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;">
          <button class="bet-chip" style="padding:10px;${tab==='dep'?'border-color:#38bdf8;color:#fff;':''}" onclick="openWalletModal('dep','${method}')">Пополнение</button>
          <button class="bet-chip" style="padding:10px;${tab==='wit'?'border-color:#38bdf8;color:#fff;':''}" onclick="openWalletModal('wit','${method}')">Вывод средств</button>
        </div>

        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;">
          ${Object.keys(PAY_M).map(k => `
            <button class="bet-chip" style="white-space:nowrap;padding:7px 10px;${k===method?'border-color:#38bdf8;color:#38bdf8;':''}" onclick="openWalletModal('${tab}','${k}')">
              ${PAY_M[k].name}
            </button>
          `).join('')}
        </div>

        ${tab === 'dep' ? `
          <div class="panel">
            <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Реквизиты для перевода (${pm.name}):</div>
            <div style="padding:9px;border-radius:10px;background:var(--bg);border:1px solid var(--border);font-size:11px;font-weight:800;word-break:break-all;margin-bottom:10px;">
              ${pm.req}
            </div>
            <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Сумма пополнения (${S.cur}):</div>
            <div class="bet-bar">
              <input type="number" id="walDepAmt" value="${fromUsd(10)}" step="any" />
              <span class="bet-chip" onclick="document.getElementById('walDepAmt').value=${fromUsd(10)}">${fmtCur(10)}</span>
              <span class="bet-chip" onclick="document.getElementById('walDepAmt').value=${fromUsd(50)}">${fmtCur(50)}</span>
              <span class="bet-chip" onclick="document.getElementById('walDepAmt').value=${fromUsd(100)}">${fmtCur(100)}</span>
            </div>
            <button class="btn-main" onclick="submitDeposit()">Пополнить баланс</button>
          </div>
        ` : `
          <div class="panel">
            <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Реквизиты получателя (${pm.name}):</div>
            <div class="bet-bar">
              <input type="text" id="walWitAddr" placeholder="Номер карты / телефона / TON адрес / @username" />
            </div>
            <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Сумма вывода (${S.cur}):</div>
            <div class="bet-bar">
              <input type="number" id="walWitAmt" value="${fromUsd(Math.min(10, S.bal))}" step="any" />
              <span class="bet-chip" onclick="document.getElementById('walWitAmt').value=${fromUsd(S.bal)}">MAX</span>
            </div>
            <button class="btn-main btn-green" onclick="submitWithdraw()">Создать заявку на вывод</button>
          </div>
        `}
      `;
    }

    function submitDeposit() {
      const inp = document.getElementById('walDepAmt');
      const usd = toUsd(inp ? inp.value : 0);
      if (usd <= 0) return toast('Введите корректную сумму');
      S.bal += usd;
      saveState();
      closeModal();
      toast(`Баланс пополнен на ${fmtCur(usd)}`);
      route();
    }

    function submitWithdraw() {
      const addr = document.getElementById('walWitAddr')?.value.trim();
      const usd = toUsd(document.getElementById('walWitAmt')?.value);
      if (!addr) return toast('Укажите реквизиты получателя');
      if (usd <= 0 || usd > S.bal) return toast('Недостаточно средств на балансе');
      S.bal -= usd;
      saveState();
      closeModal();
      toast(`Заявка на вывод ${fmtCur(usd)} принята в обработку`);
      route();
    }

    function closeModal(e) {
      if (e && e.target && e.target.id !== 'modalBackdrop') return;
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    /******************************************************************
     * 14. INIT TELEGRAM WEBAPP & START
     ******************************************************************/
    function initTelegram() {
      try {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
          tg.ready();
          tg.expand();
          if (tg.setHeaderColor) tg.setHeaderColor('#080b12');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#080b12');
          if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
          const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
          if (u) {
            S.tgUser.name = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'TG Player';
            S.tgUser.username = u.username || ('id' + u.id);
            S.tgUser.photo = u.photo_url || '';
          }
        }
      } catch (e) {}
    }

    loadState();
    initTelegram();
    updateHeaderUI();
    route();
  </script>
</body>
