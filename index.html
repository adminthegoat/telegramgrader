<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Unbattle — Telegram Gifts Upgrader & Cases</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090b12;--bg2:#101421;--card:#141929;--card2:#1b2236;--line:#232b42;--line2:#2f3a58;
  --txt:#f3f6ff;--mut:#8b96b8;--mut2:#5c6685;
  --ac:#7c5cff;--ac2:#00d4ff;--grn:#19d686;--red:#ff496c;--ylw:#ffb830;--star:#ffbe2e;
  --r-com:#7c8aa6;--r-unc:#28a9ff;--r-rar:#9b5cff;--r-epc:#ff47b6;--r-leg:#ffb319;
  --rad:18px;--rad2:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body{background-image:radial-gradient(900px 450px at 15% -10%,rgba(124,92,255,.16),transparent),radial-gradient(800px 400px at 85% 0%,rgba(0,212,255,.11),transparent)}
button,input,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}

/* HEADER */
.hdr{position:sticky;top:0;z-index:80;height:68px;background:rgba(11,14,23,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:14px}
.brand{display:flex;align-items:center;gap:12px;font-family:'Unbounded',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand-ava{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7c5cff,#00d4ff);padding:2px;position:relative;flex-shrink:0;box-shadow:0 6px 20px rgba(124,92,255,.35)}
.brand-ava-in{width:100%;height:100%;border-radius:11px;background:#101424;display:flex;align-items:center;justify-content:center;overflow:hidden}
.brand-ava-in img{width:100%;height:100%;object-fit:cover;display:block}
.brand-ava-in svg{width:28px;height:28px}
.brand-txt{display:flex;flex-direction:column;line-height:1.05}
.brand-sub{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

.nav{display:flex;align-items:center;gap:6px;background:var(--bg2);padding:5px;border-radius:14px;border:1px solid var(--line)}
.nav a{padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut);display:flex;align-items:center;gap:8px;transition:.18s}
.nav a:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.nav a.act{color:#fff;background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(0,212,255,.18));border:1px solid rgba(124,92,255,.45);box-shadow:0 4px 16px rgba(124,92,255,.2)}
.nav a svg{width:17px;height:17px}

.hdr-r{display:flex;align-items:center;gap:10px}
.cur-sw{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.cur-btn{padding:6px 10px;border-radius:9px;font-size:12px;font-weight:700;color:var(--mut);transition:.15s;display:flex;align-items:center;gap:4px}
.cur-btn.act{background:var(--card2);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cur-btn.act.star{color:var(--star)}

.ic-btn{width:40px;height:40px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);transition:.18s}
.ic-btn:hover{color:var(--txt);border-color:var(--line2)}
.ic-btn svg{width:19px;height:19px}

.bal-pill{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(25,214,134,.14),rgba(0,212,255,.1));border:1px solid rgba(25,214,134,.38);padding:6px 8px 6px 14px;border-radius:13px;font-weight:700;font-size:14px;transition:.18s}
.bal-pill:hover{border-color:var(--grn);transform:translateY(-1px)}
.bal-val{font-family:'Unbounded',sans-serif;font-size:13px;color:#fff;white-space:nowrap}
.bal-plus{width:28px;height:28px;border-radius:9px;background:var(--grn);color:#062015;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}

.ava-btn{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);padding:4px 10px 4px 4px;border-radius:99px;transition:.18s}
.ava-btn:hover{border-color:var(--ac)}
.ava-cir{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#00d4ff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;overflow:hidden;flex-shrink:0}
.ava-cir img{width:100%;height:100%;object-fit:cover}
.ava-nm{font-size:13px;font-weight:600;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* LAYOUT */
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 100px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-t{font-family:'Unbounded',sans-serif;font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
.btn{padding:11px 18px;border-radius:13px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s;border:1px solid transparent}
.btn-p{background:linear-gradient(135deg,var(--ac),#5a3df0);color:#fff;box-shadow:0 8px 24px rgba(124,92,255,.32)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(124,92,255,.45)}
.btn-g{background:linear-gradient(135deg,var(--grn),#0ea866);color:#041c10;box-shadow:0 8px 24px rgba(25,214,134,.28)}
.btn-s{background:var(--card2);border-color:var(--line2);color:var(--txt)}
.btn-s:hover{border-color:var(--ac)}
.btn:disabled{opacity:.45;pointer-events:none}

/* HERO */
.hero{background:linear-gradient(135deg,#181d34 0%,#121729 55%,#191536 100%);border:1px solid var(--line2);border-radius:24px;padding:30px;display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;margin-bottom:28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:380px;height:380px;right:-80px;top:-120px;background:radial-gradient(circle,rgba(124,92,255,.28),transparent 70%);pointer-events:none}
.hero-tag{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:rgba(124,92,255,.16);border:1px solid rgba(124,92,255,.38);color:#c4b5ff;font-size:12px;font-weight:700;margin-bottom:14px}
.hero h1{font-family:'Unbounded',sans-serif;font-size:30px;line-height:1.18;margin-bottom:12px}
.hero p{color:var(--mut);font-size:15px;line-height:1.55;margin-bottom:20px;max-width:540px}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.hero-art{display:flex;justify-content:center;align-items:center;gap:14px}
.hero-float{width:118px;height:132px;background:var(--card);border:1px solid var(--line2);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-shadow:0 16px 36px rgba(0,0,0,.38);animation:fl 3.6s ease-in-out infinite}
.hero-float:nth-child(2){transform:translateY(-12px);animation-delay:.7s;border-color:rgba(255,179,25,.5)}
.hero-float:nth-child(3){animation-delay:1.4s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* CASES GRID */
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.case-card{background:linear-gradient(180deg,var(--card) 0%,#101523 100%);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden;transition:.22s;cursor:pointer}
.case-card:hover{transform:translateY(-5px);border-color:var(--ac);box-shadow:0 16px 36px rgba(124,92,255,.18)}
.case-glow{position:absolute;width:160px;height:160px;border-radius:50%;top:10px;filter:blur(38px);opacity:.32;pointer-events:none}
.case-bdg{position:absolute;top:13px;right:13px;padding:4px 9px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.case-art{width:128px;height:128px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;margin:8px 0 12px;transition:.25s}
.case-card:hover .case-art{transform:scale(1.06)}
.case-art img,.gift-media img{width:100%;height:100%;object-fit:contain;display:block}
.case-art svg,.gift-media svg{width:100%;height:100%;display:block}
.case-nm{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;margin-bottom:4px}
.case-sub{font-size:12px;color:var(--mut);margin-bottom:14px}
.case-pr{width:100%;padding:10px;border-radius:12px;background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.35);font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:#fff;transition:.18s}
.case-card:hover .case-pr{background:var(--ac);border-color:var(--ac)}

/* ITEM CARDS */
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.icard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;position:relative;transition:.16s;cursor:pointer;overflow:hidden}
.icard:hover{border-color:var(--line2);transform:translateY(-2px)}
.icard.sel{border-color:var(--ac);background:rgba(124,92,255,.12);box-shadow:0 0 0 2px rgba(124,92,255,.35)}
.icard-bar{position:absolute;top:0;left:0;right:0;height:3px}
.icard-top{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut);margin-bottom:6px}
.gift-media{width:68px;height:68px;display:flex;align-items:center;justify-content:center;margin:4px 0 8px;flex-shrink:0}
.icard-nm{font-size:12.5px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.icard-pr{margin-top:6px;padding:4px 9px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;color:var(--grn)}

/* UPGRADER (NO-SCROLL POPUP PICKERS) */
.upg-stage{background:linear-gradient(180deg,var(--card) 0%,#0f1320 100%);border:1px solid var(--line2);border-radius:26px;padding:28px;display:grid;grid-template-columns:1fr 330px 1fr;gap:24px;align-items:center;position:relative}
.upg-slot{background:var(--bg2);border:2px dashed var(--line2);border-radius:22px;min-height:310px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.2s;position:relative}
.upg-slot:hover{border-color:var(--ac);background:rgba(124,92,255,.06);transform:translateY(-2px)}
.upg-slot.filled{border-style:solid;border-color:rgba(124,92,255,.45);background:radial-gradient(circle at 50% 35%,rgba(124,92,255,.14),var(--bg2) 70%)}
.upg-slot-lbl{position:absolute;top:16px;left:18px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.upg-slot-chg{position:absolute;top:13px;right:14px;padding:5px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line2);font-size:11px;font-weight:700;color:var(--txt)}
.upg-plus{width:68px;height:68px;border-radius:20px;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ac);margin-bottom:14px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.upg-plus svg{width:30px;height:30px}
.upg-slot-t{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;margin-bottom:6px}
.upg-slot-d{font-size:13px;color:var(--mut);max-width:230px;line-height:1.45}

.upg-mid{display:flex;flex-direction:column;align-items:center;gap:16px}
.upg-ring-w{width:250px;height:250px;position:relative;display:flex;align-items:center;justify-content:center}
.upg-ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.upg-ptr{position:absolute;inset:0;transition:transform 3.2s cubic-bezier(.12,.85,.18,1);pointer-events:none}
.upg-ptr::after{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid #fff;filter:drop-shadow(0 2px 8px rgba(255,255,255,.8))}
.upg-center{position:absolute;inset:32px;border-radius:50%;background:radial-gradient(circle,#192036,#0e1220);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}
.upg-pct{font-family:'Unbounded',sans-serif;font-size:32px;font-weight:900;line-height:1}
.upg-mult{font-size:13px;font-weight:700;color:var(--ac2);margin-top:5px}
.upg-res{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:900;font-size:22px;opacity:0;pointer-events:none;transition:.25s}
.upg-res.on{opacity:1}
.upg-res.win{background:rgba(25,214,134,.92);color:#042012}
.upg-res.lose{background:rgba(255,73,108,.92);color:#fff}

.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{padding:7px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mut);transition:.15s}
.chip:hover,.chip.act{background:rgba(124,92,255,.2);border-color:var(--ac);color:#fff}

/* ROULETTE */
.roul-box{background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:22px;margin-bottom:22px;position:relative;overflow:hidden}
.roul-win{position:relative;overflow:hidden;border-radius:16px;background:var(--bg);border:1px solid var(--line);height:150px;display:flex;align-items:center}
.roul- win+.roul-win{margin-top:10px}
.roul-ptr{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--ylw);z-index:5;transform:translateX(-50%);box-shadow:0 0 14px var(--ylw)}
.roul-ptr::before,.roul-ptr::after{content:'';position:absolute;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent}
.roul-ptr::before{top:0;border-top:10px solid var(--ylw)}
.roul-ptr::after{bottom:0;border-bottom:10px solid var(--ylw)}
.roul-trk{display:flex;gap:10px;padding:0 20px;will-change:transform}
.roul-it{width:126px;height:126px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;position:relative}

/* MODALS & TELEGRAM PROFILE */
.ov{position:fixed;inset:0;z-index:120;background:rgba(4,6,12,.76);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.mdl{background:var(--card);border:1px solid var(--line2);border-radius:24px;width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:mIn .2s ease}
.mdl.lg{max-width:780px}
@keyframes mIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mdl-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.mdl-t{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:800}
.mdl-b{padding:20px 22px;overflow-y:auto;flex:1}
.x-btn{width:34px;height:34px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.x-btn:hover{color:#fff}

/* TELEGRAM PROFILE STYLE */
.tg-prof-top{background:linear-gradient(145deg,#1e2749 0%,#141a30 60%,#1c1738 100%);padding:26px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;border-bottom:1px solid var(--line)}
.tg-ava-wrap{width:88px;height:88px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#2AABEE,#7c5cff);margin-bottom:12px;position:relative;box-shadow:0 10px 28px rgba(42,171,238,.3)}
.tg-ava{width:100%;height:100%;border-radius:50%;background:#101525;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:28px;font-weight:800;overflow:hidden}
.tg-ava img{width:100%;height:100%;object-fit:cover}
.tg-lvl-pill{position:absolute;bottom:-4px;right:-4px;background:#2AABEE;color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:99px;border:2px solid #141a30}
.tg-name{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px;justify-content:center}
.tg-user{font-size:13.5px;color:#2AABEE;font-weight:600;margin-top:2px}
.tg-status{font-size:12px;color:var(--grn);margin-top:3px}
.tg-Quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:16px}
.tg-qbtn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;transition:.15s}
.tg-qbtn:hover{background:rgba(255,255,255,.11)}
.tg-qbtn svg{width:20px;height:20px;color:#2AABEE}

.tg-group{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.tg-cell{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);font-size:13.5px}
.tg-cell:last-child{border-bottom:none}
.tg-cell-l{display:flex;flex-direction:column;gap:2px}
.tg-cell-sub{font-size:11.5px;color:var(--mut)}

.tg-tabs{display:flex;border-bottom:1px solid var(--line);margin:0 -22px 16px;padding:0 22px;gap:22px}
.tg-tab{padding:11px 2px;font-size:14px;font-weight:700;color:var(--mut);border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tg-tab.act{color:#2AABEE;border-color:#2AABEE}
.tg-gifts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tg-gcell{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;transition:.16s}
.tg-gcell:hover{border-color:#2AABEE;transform:translateY(-2px)}
.tg-gcell.sel{border-color:#2AABEE;background:rgba(42,171,238,.12)}
.tg-grib{position:absolute;top:7px;right:7px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;color:#fff}

/* FORMS & WALLET */
.tabs{display:flex;gap:6px;background:var(--bg2);padding:5px;border-radius:13px;border:1px solid var(--line);margin-bottom:16px}
.tab{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut);text-align:center}
.tab.act{background:var(--card2);color:#fff}
.inp-g{margin-bottom:14px}
.inp-l{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
.inp{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);font-size:14px;color:#fff}
.inp:focus{border-color:var(--ac)}
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.m-card{padding:11px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:.15s}
.m-card.act{border-color:var(--ac);background:rgba(124,92,255,.13)}
.m-nm{font-size:13px;font-weight:700}
.m-sub{font-size:11px;color:var(--mut)}

/* PLAY HUB & PVP */
.hub-grid{display:grid;grid-template-columns:240px 1fr;gap:20px}
.hub-menu{display:flex;flex-direction:column;gap:8px}
.hub-btn{padding:14px 16px;border-radius:15px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px;color:var(--mut);transition:.15s}
.hub-btn.act,.hub-btn:hover{border-color:var(--ac);color:#fff;background:linear-gradient(135deg,rgba(124,92,255,.2),rgba(0,212,255,.08))}
.hub-stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:340px;margin:0 auto}

.toast.ok{border-color:var(--grn)}
.toast.err{border-color:var(--red)}

.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(11,14,23,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:11px;font-size:10.5px;font-weight:700;color:var(--mut)}
.bnav a.act{color:#fff}
.bnav a svg{width:20px;height:20px}

  .hdr{padding:0 12px;height:60px}
  .nav,.brand-sub,.ava-nm{display:none}
  .bnav{display:flex}
  .hero{grid-template-columns:1fr;padding:22px}

}

const CURRENCIES = {
  USD:   { code:'USD',   sym:'$', rate:1,  dec:2, name:'Доллар США ($)' },
  RUB:   { code:'RUB',   sym:'₽', rate:96, dec:0, name:'Рубли (₽)' },
  STARS: { code:'STARS', sym:'★', rate:50, dec:0, name:'Telegram Stars (★)' }
};

function curObj(){ return CURRENCIES[S.cur] || CURRENCIES.USD; }
function toCur(usd){ return (+usd||0) * curObj().rate; }
function fromCur(val){ return (+val||0) / curObj().rate; }
function fmt(usd){
  const c = curObj();
  const v = (+usd||0) * c.rate;
  const d = c.code==='USD' ? (v<1 && v>0 ? 2 : 2) : (v<10 && v%1!==0 ? 1 : 0);
  const num = v.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
  if(c.code==='USD') return '$'+num;
  if(c.code==='RUB') return num+' ₽';
  return '★ '+num;
}

function setCur(code){
  if(!CURRENCIES[code]) return;
  S.cur = code;
  save();
  syncHdr();
  route();
}

function caseOdds(cs){
  const its = cs.items.map(id=>GMAP[id]).sort((a,b)=>a.p-b.p);
  const target = cs.price * 0.92;
  let lo=-4, hi=4;
  for(let i=0;i<32;i++){
    const mid=(lo+hi)/2;
    let ws=0, ev=0;
    for(const g of its){ const w=Math.pow(g.p,mid); ws+=w; ev+=w*g.p; }
    if(ev/ws > target) hi=mid; else lo=mid;
  }
  const k=(lo+hi)/2;
  let ws=0;
  const raw=its.map(g=>{ const w=Math.pow(g.p,k); ws+=w; return {g,w}; });
  return raw.map(x=>({g:x.g, ch:(x.w/ws)*100}));
}

  pf: {
    sSeed: rndHex(32),
    cSeed: 'unbattle-'+rndHex(6),
    nonce: 1,
    hist: []
  }
});

function rndHex(n){
  let s=''; const h='0123456789abcdef';
  for(let i=0;i<n;i++) s+=h[Math.floor(Math.random()*16)];
  return s;
}

let S = load();
function load(){
  try{
    const raw = localStorage.getItem('unbattle_v3') || localStorage.getItem('unbattle_v2');
    if(raw){
      const d = JSON.parse(raw);
      return Object.assign(DEF_STATE(), d, {user:Object.assign(DEF_STATE().user, d.user||{})});
    }
  }catch(e){}
  return DEF_STATE();
}
function save(){ try{ localStorage.setItem('unbattle_v3', JSON.stringify(S)); }catch(e){} }

async function sha256(str){
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function fr(){
  const msg = `${S.pf.sSeed}:${S.pf.cSeed}:${S.pf.nonce++}`;
  save();
  const h = await sha256(msg);
  return parseInt(h.slice(0,13),16) / Math.pow(16,13);
}

/* ЗВУК */
let actx=null;
function beep(freq=440,dur=.08,type='sine',vol=.06){
  if(!S.snd) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function toggleSnd(){ S.snd=!S.snd; save(); syncHdr(); }

function toast(msg, type='ok'){
  const box=document.getElementById('toasts');
  const d=document.createElement('div');
  d.className='toast '+type;
  d.textContent=msg;
  box.appendChild(d);
  setTimeout(()=>d.remove(), 3000);
}
function esc(s){ return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function lvl(){ return Math.floor(Math.sqrt((S.xp||0)/5))+1; }

    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>`

function renderCaseOpen(id){

function roulItemHTML(g){
  const r=rar(g.p);
  return `<div class="roul-it" style="border-bottom:3px solid ${r.c}">
    ${renderGiftMedia(g.id)}
    <div style="font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center">${esc(g.name)}</div>

async function spinCase(id){
  if(cSpin) return;
  const cs = CASES.find(x=>x.id===id);
  const cost = cs.price * cQty;
  if(S.bal < cost){ toast('Недостаточно средств на балансе','err'); openWallet('dep'); return; }
  cSpin = true;
  S.bal = +(S.bal - cost).toFixed(4);
  S.xp += Math.ceil(cost*2);
  S.stats.cases += cQty;

  const odds = caseOdds(cs);
  const wins = [];
  for(let i=0;i<cQty;i++){
    const r = (await fr())*100;
    let acc=0, pick=odds[odds.length-1].g;
    for(const o of odds){ acc+=o.ch; if(r<=acc){ pick=o.g; break; } }
    const item = {uid:'i'+Date.now()+Math.random().toString(36).slice(2,6), id:pick.id};
    S.inv.unshift(item);
    if(pick.p > S.stats.best) S.stats.best = pick.p;
    wins.push({g:pick, uid:item.uid});
  }
  save(); syncHdr();

  const winIdx = 38;
  for(let i=0;i<cQty;i++){
    const trk = document.getElementById('rtrk'+i);
    if(!trk) continue;
    const pool=[];
    for(let j=0;j<48;j++){
      const g = j===winIdx ? wins[i].g : odds[Math.floor(Math.random()*odds.length)].g;
      pool.push(roulItemHTML(g));
    }
    trk.style.transition='none';
    trk.style.transform='translateX(0px)';
    trk.innerHTML = pool.join('');
    void trk.offsetWidth;
    const w = trk.parentElement.clientWidth;
    const cardW = 136;
    const jitter = (Math.random()-.5)*50;
    const offset = (winIdx * cardW) - (w/2) + (cardW/2) + 20 + jitter;
    const dur = cFast ? 0.55 : 3.2;
    trk.style.transition = `transform ${dur}s cubic-bezier(.12,.85,.16,1)`;
    trk.style.transform = `translateX(${-offset}px)`;
  }
  beep(520,.1);

  setTimeout(()=>{
    cSpin = false;
    beep(740,.18,'triangle');
    const act = document.getElementById('caseAct');
    if(!act) return;
    const total = wins.reduce((s,x)=>s+x.g.p,0);
    const uids = wins.map(x=>x.uid);
    act.innerHTML = `
      <button class="btn btn-g" onclick="sellMany(${JSON.stringify(uids).replace(/"/g,"'")}, '${cs.id}')">Продать за ${fmt(total)}</button>
      <button class="btn btn-p" onclick="renderCaseOpen('${cs.id}')">Оставить и крутить ещё</button>
    `;
  }, cFast ? 600 : 3300);
}

function sellMany(uids, csId){
  let sum=0;
  for(const u of uids){
    const ix = S.inv.findIndex(x=>x.uid===u);
    if(ix>-1){ sum += GMAP[S.inv[ix].id].p; S.inv.splice(ix,1); }
  }
  if(sum>0){
    S.bal = +(S.bal + sum).toFixed(4);
    save(); syncHdr();
    toast(`Продано за ${fmt(sum)}`);
  }
  renderCaseOpen(csId);
}

/* =========================================================================
   8. UPGRADER (КЛИК НА "ТЫ ОТДАЁШЬ" -> ИНВЕНТАРЬ/БАЛАНС,
                КЛИК НА "ТЫ ПОЛУЧАЕШЬ" -> ВЫБОР ПОДАРКА)
========================================================================= */
let UPG = {
  mode: 'inv',      // 'inv' | 'bal'
  selUids: [],      // выбранные предметы из инвентаря
  balUsd: 5,        // сумма с баланса в USD
  targetId: 'champ',
  flt: 'all',
  q: '',
  busy: false,
  deg: 0
};

function upgSrcVal(){
  if(UPG.mode==='bal') return Math.min(S.bal, Math.max(0, +UPG.balUsd||0));
  return UPG.selUids.reduce((s,u)=>{
    const it = S.inv.find(x=>x.uid===u);
    return s + (it ? GMAP[it.id].p : 0);
  },0);
}

function upgChance(src, tgtP){
  if(src<=0 || !tgtP || tgtP <= src*1.02) return 0;
  return Math.min(95, Math.max(1, (src / tgtP) * 95));
}

function renderUpgrader(){
  UPG.selUids = UPG.selUids.filter(u=>S.inv.some(x=>x.uid===u));
  if(UPG.mode==='inv' && UPG.selUids.length===0 && S.inv.length>0){
    UPG.selUids = [S.inv[0].uid];
  }
  const src = upgSrcVal();
  const tgt = GMAP[UPG.targetId] || GIFTS[10];
  const ch = upgChance(src, tgt.p);

      <div class="upg-slot-d" style="margin-top:6px">Нажми, чтобы сменить подарок или поставить баланс</div>
    `;
  } else {
    leftBody = `
      <div class="upg-plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></div>
      <div class="upg-slot-t">Ты отдаёшь</div>
      <div class="upg-slot-d">Нажми, чтобы выбрать подарок из инвентаря или сумму с баланса</div>
    `;

  let rightBody = tgt ? `
    ${renderGiftMedia(tgt.id,'case-art')}
    <div class="upg-slot-t">${esc(tgt.name)}</div>

    <div class="upg-slot-d" style="margin-top:6px">Нажми, чтобы выбрать другой подарок для апгрейда</div>
  ` : '';

  document.getElementById('app').innerHTML = `
    <div class="sec-h">
      <div class="sec-t">Upgrader подарков</div>
      <button class="btn btn-s" onclick="openFair()">Честность</button>
    </div>

      <!-- ЛЕВАЯ КАРТОЧКА: ТЫ ОТДАЁШЬ -->
      <div class="upg-slot ${src>0?'filled':''}" onclick="openUpgGiveModal()">
        <span class="upg-slot-lbl">Ты отдаёшь</span>
        <span class="upg-slot-chg">Инвентарь / Баланс</span>
        ${leftBody}
      </div>

            <circle cx="120" cy="120" r="${r}" stroke="url(#upgGrad)" stroke-width="14" fill="none"
              stroke-linecap="round" stroke-dasharray="${dash} ${circ}"/>
            <defs>
              <linearGradient id="upgGrad" x1="0" y1="0" x2="240" y2="240">

function quickPickTarget(k){
  UPG.flt = k;
  const src = upgSrcVal() || 2;
  const wantM = k==='50p' ? 1.9 : parseFloat(k);
  const wantP = src * wantM;
  const valid = GIFTS.filter(g=>g.p > src*1.03);
  if(valid.length){
    valid.sort((a,b)=>Math.abs(a.p-wantP)-Math.abs(b.p-wantP));

async function doUpgrade(){
  if(UPG.busy) return;
  const src = upgSrcVal();
  const tgt = GMAP[UPG.targetId];
  const ch = upgChance(src, tgt.p);
  if(ch<=0) return;

  UPG.busy = true;
  if(UPG.mode==='bal'){
    if(S.bal < src){ UPG.busy=false; toast('Недостаточно средств','err'); return; }
    S.bal = +(S.bal - src).toFixed(4);
  } else {
    S.inv = S.inv.filter(x=>!UPG.selUids.includes(x.uid));
    UPG.selUids = [];
  }

  const roll = (await fr()) * 100;
  const win = roll <= ch;
  S.stats.upg++;
  S.xp += Math.ceil(src*2);

  if(win){
    S.stats.upgWin++;
    const newItem = {uid:'u'+Date.now(), id:tgt.id};
    S.inv.unshift(newItem);
    if(tgt.p > S.stats.best) S.stats.best = tgt.p;
    UPG.mode = 'inv';
    UPG.selUids = [newItem.uid];
  }
  save(); syncHdr();

  const targetDeg = (roll / 100) * 360;
  const spins = (5 + Math.floor(Math.random()*2)) * 360;
  UPG.deg = UPG.deg - (UPG.deg % 360) + spins + targetDeg;

  const ptr = document.getElementById('upgPtr');
  if(ptr) ptr.style.transform = `rotate(${UPG.deg}deg)`;
  beep(480,.12);

  setTimeout(()=>{
    const res = document.getElementById('upgRes');
    if(res){
      res.className = 'upg-res on ' + (win?'win':'lose');
      res.innerHTML = win ? `<div>ПОБЕДА!</div><div style="font-size:12px;margin-top:4px">${esc(tgt.name)}</div>` : `<div>НЕУДАЧА</div><div style="font-size:11px;margin-top:4px">${roll.toFixed(2)}%</div>`;
    }
    beep(win?780:220,.22,win?'triangle':'sawtooth');
    setTimeout(()=>{ UPG.busy=false; renderUpgrader(); }, 1300);
  }, 3250);
}

async function startPVP(){
  if(pvpBusy) return;
  const cs = CASES.find(x=>x.id===pvpCase) || CASES[2];
  const cost = cs.price * pvpRounds;
  if(S.bal < cost){ toast('Недостаточно средств','err'); openWallet('dep'); return; }
  pvpBusy = true;
  S.bal = +(S.bal - cost).toFixed(4);
  S.stats.pvp++;
  save(); syncHdr();

  const odds = caseOdds(cs);
  const pickOne = async()=>{
    const r=(await fr())*100; let a=0;
    for(const o of odds){ a+=o.ch; if(r<=a) return o.g; }
    return odds[0].g;
  };

  const me=[], bot=[];
  const meBox=document.getElementById('pvpMe'), botBox=document.getElementById('pvpBot');
  meBox.innerHTML=''; botBox.innerHTML='';

  for(let i=0;i<pvpRounds;i++){
    await new Promise(r=>setTimeout(r, 480));
    const g1 = await pickOne(), g2 = await pickOne();
    me.push(g1); bot.push(g2);
    beep(540,.08);
    meBox.innerHTML += `<div style="width:72px">${renderGiftMedia(g1.id)}<div style="font-size:10px;font-weight:700">${fmt(g1.p)}</div></div>`;
    botBox.innerHTML += `<div style="width:72px">${renderGiftMedia(g2.id)}<div style="font-size:10px;font-weight:700">${fmt(g2.p)}</div></div>`;
    document.getElementById('pvpMeSum').textContent = fmt(me.reduce((s,x)=>s+x.p,0));
    document.getElementById('pvpBotSum').textContent = fmt(bot.reduce((s,x)=>s+x.p,0));
  }

  const s1 = me.reduce((s,x)=>s+x.p,0), s2 = bot.reduce((s,x)=>s+x.p,0);
  const win = pvpCrazy ? (s1 <= s2) : (s1 >= s2);
  if(win){
    for(const g of [...me,...bot]){
      S.inv.unshift({uid:'p'+Date.now()+Math.random().toString(36).slice(2,6), id:g.id});
    }
    toast(`Победа в PVP! Вы забрали ${me.length+bot.length} подарков на ${fmt(s1+s2)}`);
  } else {
    toast('Соперник забрал банк в этом раунде','err');
  }
  save(); syncHdr();
  pvpBusy = false;
}

  if(win) S.bal = +(S.bal + usd*1.96).toFixed(4);

}

async function playDice(){
  const usd = fromCur(parseFloat(document.getElementById('betInp')?.value||0));
  if(usd<=0 || usd>S.bal){ toast('Недостаточно средств','err'); return; }
  S.bal = +(S.bal - usd).toFixed(4);
  const roll = +((await fr())*100).toFixed(2);
  const win = roll < diceVal;
  const prize = +(usd * (96/diceVal)).toFixed(4);

  const el = document.getElementById('diceRes');

  toast(win ? `Выигрыш ${fmt(prize)}!` : `Выпало ${roll}`, win?'ok':'err');
}

function mMult(m, k){
  let p=1;
  for(let i=0;i<k;i++) p *= (25-i)/(25-m-i);
  return +(p*0.96).toFixed(2);
}

async function startMines(){
  const usd = fromCur(parseFloat(document.getElementById('minesBet')?.value||0));
  if(usd<=0 || usd>S.bal){ toast('Недостаточно средств','err'); return; }
  S.bal = +(S.bal - usd).toFixed(4);
  save(); syncHdr();
  const mines=[];
  while(mines.length < minesCnt){
    const ix = Math.floor((await fr())*25);
    if(!mines.includes(ix)) mines.push(ix);
  }
  MSTATE = { bet:usd, m:minesCnt, mines, rev:[], over:false };
  renderHub();
}

function clickMine(i){
  if(!MSTATE || MSTATE.over || MSTATE.rev.includes(i)) return;
  if(MSTATE.mines.includes(i)){
    MSTATE.over = true;
    beep(180,.25,'sawtooth');
    toast('Взрыв на мине!','err');
  } else {
    MSTATE.rev.push(i);
    beep(620,.08);
    if(MSTATE.rev.length === 25 - MSTATE.m){ cashoutMines(); return; }
  }
  renderHub();
}

function cashoutMines(){
  if(!MSTATE || MSTATE.over) return;
  const mult = MSTATE.rev.length ? mMult(MSTATE.m, MSTATE.rev.length) : 1;
  const win = +(MSTATE.bet * mult).toFixed(4);
  S.bal = +(S.bal + win).toFixed(4);
  MSTATE.over = true;
  save(); syncHdr();
  toast(`Вы забрали ${fmt(win)} (x${mult})`);
  renderHub();
}

async function toggleCrash(){
  if(CSTATE && CSTATE.run && !CSTATE.cashed){
    CSTATE.cashed = true;
    const win = +(CSTATE.bet * CSTATE.cur).toFixed(4);
    S.bal = +(S.bal + win).toFixed(4);
    save(); syncHdr();
    toast(`Забрано ${fmt(win)} на x${CSTATE.cur.toFixed(2)}`);
    return;
  }
  if(CSTATE && CSTATE.run) return;
  const usd = fromCur(parseFloat(document.getElementById('crashBet')?.value||0));
  if(usd<=0 || usd>S.bal){ toast('Недостаточно средств','err'); return; }
  S.bal = +(S.bal - usd).toFixed(4);
  save(); syncHdr();

  const r = await fr();
  const crashAt = Math.max(1.01, Math.min(100, +(0.96 / (1 - r)).toFixed(2)));
  CSTATE = { bet:usd, crashAt, cur:1.00, run:true, cashed:false };
  const btn = document.getElementById('crashBtn');
  if(btn){ btn.textContent = 'Забрать'; btn.className = 'btn btn-g'; }

  const t0 = performance.now();
  const step = (now)=>{
    if(!CSTATE || !CSTATE.run) return;
    const dt = (now - t0)/1000;
    CSTATE.cur = Math.pow(Math.E, 0.16 * dt);
    const mEl = document.getElementById('crashM');
    if(CSTATE.cur >= CSTATE.crashAt){
      CSTATE.run = false;
      if(mEl){ mEl.textContent = `x${CSTATE.crashAt.toFixed(2)}`; mEl.style.color='var(--red)'; }
      if(btn){ btn.textContent = 'Запустить ракету'; btn.className='btn btn-p'; }
      return;
    }
    if(mEl){ mEl.textContent = `x${CSTATE.cur.toFixed(2)}`; mEl.style.color = CSTATE.cashed?'var(--grn)':'#fff'; }
    if(btn && !CSTATE.cashed) btn.textContent = `Забрать ${fmt(CSTATE.bet * CSTATE.cur)}`;
    requestAnimationFrame(step);
  };
  onLeave(()=>{ if(CSTATE && CSTATE.run){ CSTATE.run=false; } });
  requestAnimationFrame(step);
}

        <input class="inp" readonly value="${hash}">
      </div>
      <div class="inp-g">
        <label class="inp-l">Client Seed (можно изменить)</label>
        <div style="display:flex;gap:8px">
          <input class="inp" id="cSeedInp" value="${esc(S.pf.cSeed)}">
          <button class="btn btn-p" onclick="S.pf.cSeed=document.getElementById('cSeedInp').value;save();toast('Client Seed обновлён')">Сохранить</button>
        </div>
      </div>
      <div class="inp-g">
        <label class="inp-l">Текущий Nonce: ${S.pf.nonce}</label>
        <button class="btn btn-s" style="width:100%" onclick="rotateSeed()">Сменить Server Seed и раскрыть предыдущий</button>
      </div>
      ${S.pf.hist.length ? `
        <div class="inp-l">Раскрытые Server Seeds</div>
        <div class="tg-group">
          ${S.pf.hist.map(h=>`<div class="tg-cell"><span style="font-size:11px;word-break:break-all">${h}</span></div>`).join('')}
        </div>
      `:''}
    </div>
  `;
  document.getElementById('ov').classList.add('on');
}

function rotateSeed(){
  S.pf.hist.unshift(S.pf.sSeed);
  S.pf.hist = S.pf.hist.slice(0,5);
  S.pf.sSeed = rndHex(32);
  S.pf.nonce = 1;
  save(); openFair();
}

function closeMdl(){ document.getElementById('ov').classList.remove('on'); }

/* =========================================================================
   14. ИНИЦИАЛИЗАЦИЯ TELEGRAM MINI APP
========================================================================= */
function initTG(){
  try{
    const tg = window.Telegram?.WebApp;
    if(tg){
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.('#090b12');
      tg.setBackgroundColor?.('#090b12');
      tg.disableVerticalSwipes?.();
      const u = tg.initDataUnsafe?.user;
      if(u){
        S.user.name = [u.first_name, u.last_name].filter(Boolean).join(' ') || S.user.name;
        if(u.username) S.user.username = u.username;
        if(u.id) S.user.id = u.id;
        if(u.photo_url) S.user.photo = u.photo_url;
        save();
      }
    }
  }catch(e){}
}

renderBrandLogo();
initTG();
syncHdr();
route();
</script>
</body>
</html>
